packages:
  - "apps/*"
  - "packages/*"
  - "workers/*"

# Dependabot's pnpm updater applies a mature-release gate. These providers are kept
# current deliberately and are reviewed through their Dependabot PRs.
minimumReleaseAgeExclude:
  - next
  - "@ai-sdk/elevenlabs"

overrides:
  js-yaml: 5.4.3
  prismjs: 1.30.0
  "@xmldom/xmldom": ">=0.8.15"
  fflate: ">=0.8.3"
  postcss: ">=8.5.23"
  vite: "7.3.7"
  source-map-js: 1.2.2
  postcss-selector-parser: 7.1.6
  undici: "^8.12.2"
  fast-uri: "^3.1.9"
