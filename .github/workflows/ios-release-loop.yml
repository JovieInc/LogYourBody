name: iOS Release Loop

on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios-release-loop.yml'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - testflight
          - app_store
      submit_for_review:
        description: 'Submit App Store builds for Apple review'
        required: false
        type: boolean
        default: true
      automatic_release:
        description: 'Automatically release after Apple approval'
        required: false
        type: boolean
        default: true
      phased_release:
        description: 'Use phased release for approved App Store builds'
        required: false
        type: boolean
        default: true
      paywall_testflight_verified:
        description: 'Required for App Store submission after a real TestFlight paywall purchase/restore passes'
        required: false
        type: boolean
        default: false
  workflow_call:

concurrency:
  group: ios-release-loop-${{ github.ref }}
  cancel-in-progress: false

env:
  LOGYOURBODY_APP_IDENTIFIER: com.logyourbody.app
  LOGYOURBODY_APP_STORE_APP_ID: '6755209876'

jobs:
  # Push the release tag before validate/build/TestFlight. Those jobs take long
  # enough for later main commits to change .github/workflows. GITHUB_TOKEN
  # cannot create a tag or release at this SHA after that (HTTP 403 Resource
  # not accessible by integration). Pinning while this commit is still the
  # branch tip needs only contents:write. A scope refusal warns and continues.
  pin-release-tag:
    name: Pin Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.pin.outputs.version }}
      build_number: ${{ steps.pin.outputs.build_number }}
      tag: ${{ steps.pin.outputs.tag }}
      pinned: ${{ steps.pin.outputs.pinned }}
      created_tag: ${{ steps.pin.outputs.created_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Pin the release tag to this commit
        id: pin
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type || 'testflight' }}
        run: .github/scripts/pin-ios-release-tag.sh

  # Poll on Linux. A macos runner held only for this wait delays the
  # StoreKit job CI Summary is waiting on.
  validate-release:
    name: Validate Release
    needs: pin-release-tag
    runs-on: ubuntu-latest
    # Must exceed validate-release-source.sh's RELEASE_CHECK_TIMEOUT_SECONDS (10901s).
    timeout-minutes: 200
    permissions:
      contents: read
      checks: read
      statuses: read
      actions: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate release source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ github.event.inputs.release_type || 'testflight' }}
        run: .github/scripts/validate-release-source.sh

  bind-release-version:
    name: Bind Release Version
    needs: [pin-release-tag, validate-release]
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install auth contract dependencies
        run: pnpm install --frozen-lockfile --filter logyourbody...

      - name: Verify production Apple auth contract
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: |
          node --test .github/scripts/verify-ios-auth-contract.test.mjs
          node .github/scripts/verify-ios-auth-contract.mjs

      - name: Extract version info
        id: version
        env:
          PINNED_VERSION: ${{ needs.pin-release-tag.outputs.version }}
          PINNED_BUILD: ${{ needs.pin-release-tag.outputs.build_number }}
        run: |
          cd apps/ios

          # Info.plist stores the Xcode placeholder, so resolve the real app
          # version from build settings before passing it to downstream jobs.
          # The release tag was already named from the project file; the
          # binary must use that same version and the build number pinned
          # before release validation waited on CI.
          VERSION=$(xcodebuild \
            -project LogYourBody.xcodeproj \
            -scheme LogYourBody \
            -configuration Release \
            -showBuildSettings 2>/dev/null \
            | awk -F ' = ' '/MARKETING_VERSION/ { print $2; exit }')

          UNRESOLVED_MARKER="\$("
          VERSION=$(printf '%s' "$VERSION" | tr -d '[:space:]')
          if [ -z "$VERSION" ] || printf '%s' "$VERSION" | grep -qF "$UNRESOLVED_MARKER"; then
            echo "::error::Unable to resolve MARKETING_VERSION for release"
            exit 1
          fi
          if [ "$VERSION" != "$PINNED_VERSION" ]; then
            echo "::error::MARKETING_VERSION $VERSION does not match pinned release tag version $PINNED_VERSION"
            exit 1
          fi
          if [ -z "$PINNED_BUILD" ]; then
            echo "::error::Release build number was not pinned"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$PINNED_BUILD" >> "$GITHUB_OUTPUT"

          echo "📦 Version: $VERSION"
          echo "🔢 Build: $PINNED_BUILD"

  # Reuse a previously validated artifact if possible.
  check-existing-build:
    name: Check Existing Build
    needs: validate-release
    runs-on: ubuntu-latest
    outputs:
      has_artifact: ${{ steps.check.outputs.exists }}
      artifact_url: ${{ steps.check.outputs.url }}

    steps:
      - name: Check for existing release artifact
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Look for a recent validated build artifact.
          echo "🔍 Checking for reusable release build..."

          # This is a placeholder - in production, you'd check artifact storage
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "ℹ️ No reusable build found, will build fresh"

  build-release:
    name: Build Release
    needs: [bind-release-version, check-existing-build]
    if: needs.check-existing-build.outputs.has_artifact != 'true'
    runs-on: macos-26
    timeout-minutes: 30
    environment:
      name: ${{ github.event.inputs.release_type == 'app_store' && 'Production' || 'production-testflight' }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup iOS Build Environment
        uses: ./.github/actions/setup-ios-build
        with:
          xcode-version: 'latest-stable'
          working-directory: apps/ios
          create-config-files: 'false'

      - name: Write production iOS config
        run: apps/ios/Scripts/write_release_config.sh
        env:
          REVENUE_CAT_PUBLIC_KEY: ${{ secrets.REVENUE_CAT_PUBLIC_KEY }}
          STATSIG_CLIENT_SDK_KEY: ${{ secrets.STATSIG_CLIENT_SDK_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Verify RevenueCat iOS offering
        run: apps/ios/Scripts/verify_revenuecat_offerings.sh
        env:
          REVENUE_CAT_PUBLIC_KEY: ${{ secrets.REVENUE_CAT_PUBLIC_KEY }}

      - name: Install Compatible OpenSSL
        run: |
          if brew list openssl@1.1 >/dev/null 2>&1 || brew install openssl@1.1; then
            echo "$(brew --prefix openssl@1.1)/bin" >> "$GITHUB_PATH"
          else
            echo "::warning::openssl@1.1 unavailable; continuing with the runner OpenSSL"
          fi

      - name: Setup Match Authentication
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          cd apps/ios
          mkdir -p fastlane

          ruby <<'RUBY'
          require "json"

          api_key = {
            "key_id" => ENV.fetch("ASC_KEY_ID"),
            "issuer_id" => ENV.fetch("ASC_ISSUER_ID"),
            "key" => ENV.fetch("ASC_PRIVATE_KEY").gsub("\\n", "\n"),
            "duration" => 1200,
            "in_house" => false
          }

          File.write("fastlane/api_key.json", JSON.pretty_generate(api_key))
          JSON.parse(File.read("fastlane/api_key.json"))
          RUBY

          # Set API key path for subsequent steps
          echo "APP_STORE_CONNECT_API_KEY_PATH=$(pwd)/fastlane/api_key.json" >> "$GITHUB_ENV"

      - name: Verify App Store subscription products
        run: |
          cd apps/ios
          bundle exec ruby ../../.github/scripts/verify-app-store-subscriptions.rb
        env:
          APP_STORE_APP_ID: ${{ env.LOGYOURBODY_APP_STORE_APP_ID }}
          APP_IDENTIFIER: ${{ env.LOGYOURBODY_APP_IDENTIFIER }}

      - name: Sync Certificates with Match
        uses: ./.github/actions/sync-match
        with:
          match_password: ${{ secrets.MATCH_PASSWORD }}
          match_git_url: ${{ secrets.MATCH_GIT_URL }}
          match_git_basic: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

      - name: Set Environment Variables for Build
        run: |
          cd apps/ios
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
          echo "APP_STORE_APP_ID=${{ env.LOGYOURBODY_APP_STORE_APP_ID }}" >> "$GITHUB_ENV"

      - name: Update version and build
        run: |
          cd apps/ios

          # Update build number
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ needs.bind-release-version.outputs.build_number }}" LogYourBody/Info.plist

          echo "📱 Building iOS app for release..."

      - name: Install sentry-cli (pinned)
        env:
          SENTRY_CLI_VERSION: '3.8.0'
        run: |
          curl -fsSL -o /usr/local/bin/sentry-cli \
            "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Darwin-universal"
          chmod +x /usr/local/bin/sentry-cli
          sentry-cli --version

      - name: Archive and export
        run: |
          set -o pipefail
          cd apps/ios

          # Use Fastlane to build while preserving its exit status through tee.
          bundle exec fastlane build_release 2>&1 | tee fastlane.log
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_BRANCH: ${{ secrets.MATCH_GIT_BRANCH || 'main' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ios-release-build
          path: apps/ios/build/*.ipa
          retention-days: 3

      - name: Cleanup
        if: always()
        run: |
          cd apps/ios
          # API key is now handled via environment variables

  deploy-testflight:
    name: Deploy to TestFlight
    needs: [bind-release-version, build-release]
    if: github.event.inputs.release_type != 'app_store'
    permissions:
      contents: write
    uses: ./.github/workflows/ios-testflight-deploy.yml
    with:
      distribution_group: alpha
      build_number: ${{ needs.bind-release-version.outputs.build_number }}
      version_name: ${{ needs.bind-release-version.outputs.version }}
      artifact_name: ios-release-build
      environment: production-testflight
      release_notes: |
        Version ${{ needs.bind-release-version.outputs.version }}
        Build ${{ needs.bind-release-version.outputs.build_number }}

        This is a production release candidate.

        Changes:
        - All changes passed the main-branch release workflow
        - Ready for production release

        Please test thoroughly before App Store submission.
    secrets: inherit

  deploy-app-store:
    name: Deploy to App Store
    needs: [bind-release-version, build-release]
    if: github.event.inputs.release_type == 'app_store'
    runs-on: macos-26
    timeout-minutes: 30
    environment:
      name: production-app-store
      url: https://apps.apple.com/us/app/logyourbody/id6755209876

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-release-build
          path: apps/ios/build

      - name: Setup iOS Build Environment
        uses: ./.github/actions/setup-ios-build
        with:
          xcode-version: 'latest-stable'
          working-directory: apps/ios

      - name: Set Environment Variables for Build
        run: |
          cd apps/ios
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
          echo "APP_STORE_APP_ID=${{ env.LOGYOURBODY_APP_STORE_APP_ID }}" >> "$GITHUB_ENV"

      - name: Setup App Store Connect Authentication
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          cd apps/ios
          mkdir -p fastlane

          ruby <<'RUBY'
          require "json"

          api_key = {
            "key_id" => ENV.fetch("ASC_KEY_ID"),
            "issuer_id" => ENV.fetch("ASC_ISSUER_ID"),
            "key" => ENV.fetch("ASC_PRIVATE_KEY").gsub("\\n", "\n"),
            "duration" => 1200,
            "in_house" => false
          }

          File.write("fastlane/api_key.json", JSON.pretty_generate(api_key))
          JSON.parse(File.read("fastlane/api_key.json"))
          RUBY

          echo "APP_STORE_CONNECT_API_KEY_PATH=$(pwd)/fastlane/api_key.json" >> "$GITHUB_ENV"

      - name: Ensure App Store Free Pricing
        run: |
          cd apps/ios
          bundle exec ruby ../../.github/scripts/ensure-app-store-free-pricing.rb
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_APP_ID: ${{ env.LOGYOURBODY_APP_STORE_APP_ID }}
          APP_IDENTIFIER: ${{ env.LOGYOURBODY_APP_IDENTIFIER }}

      # Options come from apps/ios/fastlane/Precheckfile: every metadata rule
      # at error level, in-app purchases excluded because precheck cannot read
      # them with an API key. IAP and subscription readiness is checked by
      # app-store-connect-readiness.yml and the build's subscription step.
      - name: Run Fastlane Precheck
        run: |
          set -o pipefail
          cd apps/ios
          bundle exec fastlane precheck 2>&1 | tee precheck.log

          # Second check: name real fastlane failure lines, not changelog text.
          if ! node ../../.github/scripts/fastlane-log-failures.mjs precheck.log; then
            echo "::error::Precheck errors detected - see lines above"
            exit 1
          fi
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_APP_ID: ${{ env.LOGYOURBODY_APP_STORE_APP_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'

      - name: Submit to App Store
        run: |
          cd apps/ios

          SUBMIT_FOR_REVIEW="${{ github.event.inputs.submit_for_review || 'true' }}"
          AUTOMATIC_RELEASE="${{ github.event.inputs.automatic_release || 'true' }}"
          PHASED_RELEASE="${{ github.event.inputs.phased_release || 'true' }}"
          PAYWALL_TESTFLIGHT_VERIFIED="${{ github.event.inputs.paywall_testflight_verified || 'false' }}"

          if [ "$SUBMIT_FOR_REVIEW" = "true" ] && [ "$PAYWALL_TESTFLIGHT_VERIFIED" != "true" ]; then
            echo "::error::App Store submission is blocked until a real TestFlight paywall purchase and restore have been verified. Re-run with paywall_testflight_verified=true only after that proof exists."
            exit 1
          fi

          IPA_PATH="$(find "$GITHUB_WORKSPACE/apps/ios/build" -name "*.ipa" -type f -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No IPA file found in downloaded build artifact"
            find "$GITHUB_WORKSPACE/apps/ios/build" -maxdepth 4 -type f -print || true
            exit 1
          fi

          echo "Submitting IPA: $IPA_PATH"

          # Submit for review
          set -o pipefail
          bundle exec fastlane submit_app_store \
            ipa_path:"$IPA_PATH" \
            submit_for_review:$SUBMIT_FOR_REVIEW \
            automatic_release:$AUTOMATIC_RELEASE \
            phased_release:$PHASED_RELEASE 2>&1 | tee submit.log

          # Second check: name real fastlane failure lines, not changelog text.
          if ! node ../../.github/scripts/fastlane-log-failures.mjs submit.log; then
            echo "::error::Submission errors detected - see lines above"
            exit 1
          fi
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_APP_ID: ${{ env.LOGYOURBODY_APP_STORE_APP_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          APP_REVIEW_FIRST_NAME: ${{ vars.APP_REVIEW_FIRST_NAME }}
          APP_REVIEW_LAST_NAME: ${{ vars.APP_REVIEW_LAST_NAME }}
          APP_REVIEW_EMAIL_ADDRESS: ${{ vars.APP_REVIEW_EMAIL_ADDRESS }}
          APP_REVIEW_PHONE_NUMBER: ${{ secrets.APP_REVIEW_PHONE_NUMBER || vars.APP_REVIEW_PHONE_NUMBER }}
          APP_REVIEW_NOTES: ${{ vars.APP_REVIEW_NOTES }}

      - name: Cleanup
        if: always()
        run: |
          cd apps/ios
          rm -f fastlane/api_key.json

  create-release:
    name: Create Release
    needs: [bind-release-version, deploy-testflight, deploy-app-store]
    if: always() && (needs.deploy-testflight.result == 'success' || needs.deploy-app-store.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ github.event.inputs.release_type || 'testflight' }}
          RELEASE_VERSION: ${{ needs.bind-release-version.outputs.version }}
          RELEASE_BUILD: ${{ needs.bind-release-version.outputs.build_number }}
          RELEASE_ACTOR: ${{ github.actor }}
        run: .github/scripts/create-ios-github-release.sh

  remove-unshipped-release-tag:
    name: Remove Unshipped Release Tag
    needs: [pin-release-tag, deploy-testflight, deploy-app-store]
    if: always() && needs.pin-release-tag.outputs.created_tag == 'true' && needs.deploy-testflight.result != 'success' && needs.deploy-app-store.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Delete the unshipped tag
        env:
          TAG: ${{ needs.pin-release-tag.outputs.tag }}
        run: .github/scripts/pin-ios-release-tag.sh delete
