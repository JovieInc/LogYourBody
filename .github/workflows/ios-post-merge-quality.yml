name: iOS Post-Merge Launch Quality
# Launch Quality for main after merge. Merge groups run iOS Unit only; the pre-merge Launch
# Quality gate runs on the PR head (ci.yml). This run checks the integrated tree that landed.
# A failure is retried once; a second failure opens or updates the post-merge-lq-red issue,
# which holds iOS merge groups on Launch Quality until a later main SHA passes and closes it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Latest main SHA only. A newer push cancels an older in-flight check; its diff starts
  # from the last SHA this workflow verified, so the cancelled run's changes are still covered.
  group: ios-post-merge-quality
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ios: ${{ steps.scope.outputs.ios_changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the last verified main SHA
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A run succeeds only when its Launch Quality passed or had no iOS input to check,
          # so the newest successful run's SHA is the newest verified main. No answer means
          # an empty base, which selects every surface.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios-post-merge-quality.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null) || sha=''
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Select iOS changes since then
        id: scope
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: post_merge
        run: bash .github/scripts/detect-changes.sh

  quality:
    name: Launch Quality
    needs: scope
    if: needs.scope.outputs.ios == 'true'
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/ios-quality.yml
    with:
      checkout-ref: ${{ github.sha }}
      mac-first: true
      supersede-key: post-merge-main

  retry:
    name: Launch Quality Retry
    needs: [scope, quality]
    if: ${{ !cancelled() && needs.quality.result == 'failure' }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/ios-quality.yml
    with:
      checkout-ref: ${{ github.sha }}
      mac-first: true
      supersede-key: post-merge-main

  report:
    name: Report
    needs: [scope, quality, retry]
    if: ${{ always() && needs.scope.outputs.ios == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Open, update or close the post-merge-lq-red issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          RETRY_RESULT: ${{ needs.retry.result }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/post-merge-quality-report.sh
