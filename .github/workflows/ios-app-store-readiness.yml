name: iOS App Store Readiness (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  readiness:
    name: Read App Store 1.2.0 Readiness
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test the read-only report
        run: node --test .github/scripts/app-store-readiness.test.mjs

      - name: Read readiness and write pass/fail table
        env:
          GH_TOKEN: ${{ github.token }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: node .github/scripts/app-store-readiness.mjs
