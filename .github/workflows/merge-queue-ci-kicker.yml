name: Merge Queue CI Kicker

# A merge group enqueued by auto-enrollment (GITHUB_TOKEN) never starts CI on
# its own: GitHub creates no workflow runs for events caused by GITHUB_TOKEN,
# with the documented exception of workflow_dispatch. This job dispatches CI
# onto every merge-group ref that has no CI run yet, so the queue's required
# "CI Summary" check can report before check_response_timeout_minutes.
# No secrets, no checkout, no pull-request code runs here.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: merge-queue-ci-kicker
  cancel-in-progress: false

jobs:
  kick:
    name: Dispatch CI for merge groups without a run
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CI onto merge-group refs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: refs } = await github.rest.git.listMatchingRefs({
              owner,
              repo,
              ref: 'heads/gh-readonly-queue/main/',
            });
            if (!refs.length) {
              core.info('No merge-group refs waiting.');
              return;
            }
            for (const ref of refs) {
              const branch = ref.ref.replace('refs/heads/', '');
              const headSha = ref.object.sha;
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'ci.yml',
                head_sha: headSha,
                per_page: 5,
              });
              if (data.workflow_runs.length) {
                core.info(`${branch}: CI already exists (${data.workflow_runs[0].event}, ${data.workflow_runs[0].status}).`);
                continue;
              }
              const match = branch.match(/^gh-readonly-queue\/main\/pr-\d+-([0-9a-f]{40})$/);
              const baseSha = match ? match[1] : '';
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'ci.yml',
                ref: branch,
                inputs: { merge_group_base_sha: baseSha },
              });
              core.notice(`DISPATCHED: CI for ${branch} head=${headSha.slice(0, 9)} base=${baseSha.slice(0, 9)}`);
            }
