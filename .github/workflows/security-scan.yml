name: Security Scanning

on:
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Monday at 8 AM
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Full history for comprehensive scanning
    
    - name: Run TruffleHog OSS
      uses: trufflesecurity/trufflehog@v3.97.9
      with:
        path: ./
        # An empty base scans full history; main and HEAD coincide on main runs.
        head: HEAD
        extra_args: --debug --only-verified --json
    
    - name: Run Gitleaks
      shell: bash
      env:
        GITLEAKS_ARCHIVE_URL: 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
        GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
      run: |
        set -euo pipefail
        gitleaks_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
        archive="$gitleaks_dir/gitleaks.tar.gz"
        curl --fail --silent --show-error --location \
          --output "$archive" \
          "$GITLEAKS_ARCHIVE_URL"
        printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
        tar -xzf "$archive" -C "$gitleaks_dir" gitleaks
        "$gitleaks_dir/gitleaks" git --log-opts=--all --redact=100 --exit-code=1 --no-banner --no-color .

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: high
        base-ref: ${{ github.event.before }}
        head-ref: ${{ github.sha }}
        
  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Generate SBOM with CycloneDX
      uses: CycloneDX/gh-node-module-generatebom@v1
      with:
        path: ./
        output: ./sbom.json
    
    - name: Upload SBOM as artifact
      uses: actions/upload-artifact@v5
      with:
        name: sbom-${{ github.sha }}
        path: sbom.json
        retention-days: 3
