name: Security Scanning

# No clock: every scanned input (history, lockfile, pinned scanner versions)
# only changes on a push to main, which runs every job here.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Full history for comprehensive scanning
    
    - name: Run TruffleHog OSS
      uses: trufflesecurity/trufflehog@v3.99.2
      with:
        path: ./
        # On pushes, scan only the pushed commits; an empty base scans full
        # history up to HEAD on manual dispatch.
        base: ${{ github.event_name == 'push' && github.event.before || '' }}
        head: ${{ github.event_name == 'push' && github.sha || 'HEAD' }}
        extra_args: --debug --only-verified --json
    

  gitleaks:
    name: Gitleaks (shared JovieInc/ci)
    # Block new leaks on change-triggered runs without letting legacy or
    # unmerged refs mask the result. Manual audits retain the comprehensive
    # history scan.
    uses: JovieInc/ci/.github/workflows/secret-scan.yml@44105468cc7c271e5f117baec9effca295ebd13c
    with:
      full-history: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: high
        
  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Generate SBOM with CycloneDX
      uses: CycloneDX/gh-node-module-generatebom@v1
      with:
        path: ./
        output: ./sbom.json
    
    - name: Upload SBOM as artifact
      uses: actions/upload-artifact@v5
      with:
        name: sbom-${{ github.sha }}
        path: sbom.json
        retention-days: 3
