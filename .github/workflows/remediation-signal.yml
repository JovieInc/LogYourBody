name: Remediation signal

# Files non-iOS failures into the Symphony remediation router (JOV-7540 / LYB-94).
# Labels are remediation:<detector-key> on Linear team LYB:
#   CI push to main        -> remediation:red-checks
#   Deploy push to main    -> remediation:web-deploy
#   nightly homepage probe -> remediation:synthetic-monitoring
# The probe tries 3 times with backoff and follows redirects. Apex 307s to
# www, and a final 200 is green. One confirmed red is held. Linear is
# called only when the next run is red too. Filing is on unless repository
# variable REMEDIATION_INTAKE_DISABLED is exactly 1. An unset variable does not
# dry-run. Steady greens do not call Linear. A missing LINEAR_API_KEY or a
# Linear error writes a warning and a step summary that filing was SKIPPED,
# then exits 0. Red/green state is the remediation-continuity-state artifact
# (90 days), one artifact per detector. A missing artifact starts the count
# over, so the next homepage red is held instead of filed.
#
# Known gap, not edited here: ios-release-loop.yml has no cron and no re-run
# after a failed release (push to main on iOS paths, workflow_dispatch, and
# workflow_call only). Golden-path filing waits with the Fastfile and ios-*.yml
# workflows. There is no scheduled iOS golden-path job to attach to.

on:
  workflow_run:
    workflows:
      - CI
      - Deploy
    types: [completed]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/remediation-signal.mjs'
      - '.github/scripts/remediation-signal-intake.mjs'
      - '.github/scripts/remediation-signal.test.mjs'
      - '.github/scripts/lib/linear-issue-intake.mjs'
      - '.github/workflows/remediation-signal.yml'
      - 'packages/shared-lib/package.json'
      - 'packages/shared-lib/turbo.json'

permissions: {}

concurrency:
  group: remediation-signal-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    name: Remediation signal tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node --test .github/scripts/remediation-signal.test.mjs .github/scripts/ci-remediation.test.mjs

  signal:
    name: File remediation signal
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push' &&
       (github.event.workflow_run.name == 'CI' || github.event.workflow_run.name == 'Deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore continuity state
        id: restore
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          mkdir -p .remediation
          name="remediation-continuity-state-web-deploy"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            name="remediation-continuity-state-synthetic-monitoring"
          elif [ "$WORKFLOW_RUN_NAME" = "CI" ]; then
            name="remediation-continuity-state-red-checks"
          fi
          echo "artifact=$name" >> "$GITHUB_OUTPUT"
          id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" --jq '([(.artifacts // [])[] | select(.expired|not)] | sort_by(.created_at) | last | .id) // empty' || true)"
          if [ -z "$id" ]; then
            exit 0
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > .remediation/prior.zip; then
            exit 0
          fi
          entry="$(unzip -Z1 .remediation/prior.zip 2>/dev/null | head -1 || true)"
          if [ -n "$entry" ]; then
            unzip -p .remediation/prior.zip "$entry" > .remediation/state || true
          fi

      - name: Upsert or resolve the labeled issue
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REMEDIATION_INTAKE_DISABLED: ${{ vars.REMEDIATION_INTAKE_DISABLED }}
          REMEDIATION_RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          REMEDIATION_PREVIOUS_FILE: .remediation/state
          REMEDIATION_STATE_FILE: .remediation/state
        run: node .github/scripts/remediation-signal-intake.mjs

      - name: Save continuity state
        if: hashFiles('.remediation/state.dirty') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.restore.outputs.artifact }}
          path: .remediation/state
          if-no-files-found: ignore
          retention-days: 90
