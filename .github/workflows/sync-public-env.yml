name: Sync public build env

# One-off, manual. Copies the Statsig client SDK key (public by design) from the
# Production environment secret into Vercel as a plain NEXT_PUBLIC_STATSIG_CLIENT_KEY,
# because Vercel Sensitive variables pull as "[SENSITIVE]" and break Deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync Statsig client key to Vercel as plain
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_bpNDbti6srVLYPKdmQLu4UgT
      VERCEL_PROJECT_ID: prj_6seYBdTtY3TuFqrJek1puaFG6Trj
      STATSIG_CLIENT_KEY_VALUE: ${{ secrets.STATSIG_CLIENT_SDK_KEY }}
    steps:
      - name: Replace NEXT_PUBLIC_STATSIG_CLIENT_KEY with a plain variable
        run: |
          node --input-type=module -e '
            const { VERCEL_TOKEN: token, VERCEL_ORG_ID: team, VERCEL_PROJECT_ID: project, STATSIG_CLIENT_KEY_VALUE: value } = process.env;
            if (!/^client-[A-Za-z0-9_-]+$/.test(value ?? "")) { console.error("::error::STATSIG_CLIENT_SDK_KEY is missing or not a client- key"); process.exit(1); }
            const base = `https://api.vercel.com`;
            const headers = { Authorization: `Bearer ${token}`, "Content-Type": "application/json" };
            const list = await (await fetch(`${base}/v9/projects/${project}/env?teamId=${team}`, { headers })).json();
            for (const e of list.envs.filter((e) => e.key === "NEXT_PUBLIC_STATSIG_CLIENT_KEY")) {
              const r = await fetch(`${base}/v9/projects/${project}/env/${e.id}?teamId=${team}`, { method: "DELETE", headers });
              if (!r.ok) { console.error(`::error::delete failed (${r.status})`); process.exit(1); }
            }
            const r = await fetch(`${base}/v10/projects/${project}/env?teamId=${team}`, { method: "POST", headers, body: JSON.stringify({ key: "NEXT_PUBLIC_STATSIG_CLIENT_KEY", value, type: "plain", target: ["production", "preview"] }) });
            if (!r.ok) { console.error(`::error::create failed (${r.status})`); process.exit(1); }
            console.log("NEXT_PUBLIC_STATSIG_CLIENT_KEY re-created as plain for production and preview.");
          '
