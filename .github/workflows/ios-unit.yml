name: iOS Unit
# iOS build, fastlane CI and unit-tier tests for one exact SHA. CI calls it with mac-first so an idle self-hosted jovie-mac
# Mac runs it (mac-lane.yml child run); otherwise hosted macOS does. Policy:
# JovieInc/Jovie .claude/rules/infra.md "macOS runners".

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact SHA to test; empty uses the event SHA.
        required: false
        default: ''
        type: string
      supersede-key:
        description: Stable identity whose newer Mac child run supersedes an older one.
        required: false
        default: ''
        type: string
      mac-first:
        description: Prefer an idle self-hosted Mac (mac-lane-route.yml); hosted otherwise.
        required: false
        default: false
        type: boolean
      mac-child:
        description: Set only by mac-lane.yml; runs the lane on the self-hosted Macs.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  mac:
    name: Mac Route
    if: ${{ inputs.mac-first && !inputs.mac-child }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/mac-lane-route.yml
    with:
      lane: ios
      checkout-sha: ${{ inputs.checkout-ref || github.sha }}
      supersede-key: ${{ inputs.supersede-key }}

  unit:
    name: Unit
    needs: [mac]
    if: ${{ !cancelled() && (inputs.mac-child || needs.mac.result == 'skipped' || needs.mac.outputs.run_hosted == 'true') }}
    runs-on: ${{ inputs.mac-child && fromJSON('["self-hosted","macOS","ARM64","jovie-mac"]') || 'macos-15' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}

      - name: Setup iOS build environment
        uses: ./.github/actions/setup-ios-build
        with:
          xcode-version: 'latest-stable'
          working-directory: apps/ios
          setup-ruby: 'true'
          create-config-files: 'true'

      # Hosted VMs start cold. A persistent Mac keeps these locally, and
      # saving multi-GB caches over its home uplink would outlast the job.
      - name: Cache Swift packages
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/cache@v6
        with:
          path: |
            apps/ios/.build
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-xcode-stable-${{ hashFiles('**/Package.resolved', '**/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-xcode-stable-
            ${{ runner.os }}-spm-

      - name: Fastlane iOS CI
        run: |
          cd apps/ios
          bundle exec fastlane ci_ios

      - name: Unit-tier tests
        run: |
          cd apps/ios
          DESTINATION=$(SCHEME=LogYourBodyTiers bash ../../scripts/ios/resolve-simulator-destination.sh)
          bundle exec fastlane ci_test_unit destination:"$DESTINATION"

      - name: Unit test duration + coverage report
        if: always()
        run: |
          BUNDLE=$(ls -d apps/ios/test_results/unit-tier/*.xcresult 2>/dev/null | head -1 || true)
          if [[ -n "$BUNDLE" ]]; then
            python3 scripts/ios/test-tier-report.py "$BUNDLE" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No unit-tier result bundle found to report on." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
