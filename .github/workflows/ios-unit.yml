name: iOS Unit
# iOS build, fastlane CI and unit-tier tests for one exact SHA. CI calls it with mac-first so an idle self-hosted jovie-mac
# Mac runs it (mac-lane.yml child run); otherwise hosted macOS does. Policy:
# JovieInc/Jovie .claude/rules/infra.md "macOS runners".

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact SHA to test; empty uses the event SHA.
        required: false
        default: ''
        type: string
      supersede-key:
        description: Stable identity whose newer Mac child run supersedes an older one.
        required: false
        default: ''
        type: string
      mac-first:
        description: Prefer an idle self-hosted Mac (mac-lane-route.yml); hosted otherwise.
        required: false
        default: false
        type: boolean
      mac-child:
        description: Set only by mac-lane.yml; runs the lane on the self-hosted Macs.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  mac:
    name: Mac Route
    if: ${{ inputs.mac-first && !inputs.mac-child }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/mac-lane-route.yml
    with:
      lane: ios
      checkout-sha: ${{ inputs.checkout-ref || github.sha }}
      supersede-key: ${{ inputs.supersede-key }}

  unit:
    name: Unit
    needs: [mac]
    if: ${{ !cancelled() && (inputs.mac-child || needs.mac.result == 'skipped' || needs.mac.outputs.run_hosted == 'true') }}
    runs-on: ${{ inputs.mac-child && fromJSON('["self-hosted","macOS","ARM64","jovie-mac"]') || 'macos-15' }}
    timeout-minutes: 40
    env:
      # Fastlane otherwise rewrites tracked README.md after each lane.
      FASTLANE_SKIP_DOCS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0

      - name: Setup iOS build environment
        uses: ./.github/actions/setup-ios-build
        with:
          xcode-version: 'latest-stable'
          working-directory: apps/ios
          setup-ruby: 'true'
          create-config-files: 'true'

      # Hosted VMs start cold. A persistent Mac keeps these locally, and
      # saving multi-GB caches over its home uplink would outlast the job.
      - name: Cache Swift packages
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/cache@v6
        with:
          path: |
            apps/ios/.build
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-xcode-stable-${{ hashFiles('**/Package.resolved', '**/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-xcode-stable-
            ${{ runner.os }}-spm-

      - name: Fastlane source integrity regression controls
        run: |
          cd apps/ios
          bundle exec ruby ../../scripts/ios/test_fastlane_source_integrity.rb

      - name: Fastlane iOS CI
        run: |
          cd apps/ios
          bundle exec fastlane ci_ios

      - name: Unit-tier tests and native coverage ratchet
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          UNIT_RESULTS="$GITHUB_WORKSPACE/apps/ios/test_results/unit-tier/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ ! -e "$UNIT_RESULTS" ]] || { echo "Refusing stale Unit-tier output"; exit 65; }
          mkdir -p "$UNIT_RESULTS"
          echo "UNIT_RESULTS=$UNIT_RESULTS" >> "$GITHUB_ENV"
          STARTED_AT="$(date +%s)"
          git rev-parse HEAD > "$UNIT_RESULTS/source-revision.txt"
          git diff HEAD --binary > "$UNIT_RESULTS/source-before-unit.patch"
          [[ ! -s "$UNIT_RESULTS/source-before-unit.patch" ]] || { echo "Refusing dirty Unit-tier input"; exit 65; }
          set +e
          (
            set -e
            cd apps/ios
            DESTINATION=$(SCHEME=LogYourBodyTiers bash ../../scripts/ios/resolve-simulator-destination.sh)
            bundle exec fastlane ci_test_unit destination:"$DESTINATION" output_directory:"$UNIT_RESULTS"
          ) 2>&1 | tee "$UNIT_RESULTS/unit-tier.log"
          UNIT_STATUS=$?
          set -e
          # Bind evidence to the actual post-test tree, including failure paths.
          git diff HEAD --binary > "$UNIT_RESULTS/source-working-tree.patch"
          [[ "$UNIT_STATUS" -eq 0 ]] || exit "$UNIT_STATUS"
          set -- "$UNIT_RESULTS"/*.xcresult
          [[ "$#" -eq 1 && -d "$1" ]] || { echo "Expected one current Unit-tier xcresult"; exit 65; }
          BUNDLE="$1"
          python3 scripts/ios/launch-quality-evidence.py --bundle "$BUNDLE" \
            --started-at "$STARTED_AT" --export-coverage
          python3 scripts/ios/native-coverage-ratchet.py \
            --coverage "${BUNDLE%.xcresult}.coverage.json" --evidence "${BUNDLE%.xcresult}.evidence.json" \
            --baseline scripts/ios/native-coverage-baseline.json --profile unit-tier \
            --source-sha "$(git rev-parse HEAD)" --base-revision "${BASE_SHA:-}" --source-root "$GITHUB_WORKSPACE" \
            --scheme LogYourBodyTiers --test-plan Unit > "$UNIT_RESULTS/native-coverage-ratchet.json"

      - name: Upload Unit-tier coverage receipts
        if: always() && runner.environment == 'github-hosted' && env.UNIT_RESULTS != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-unit-native-coverage-${{ github.run_id }}
          path: |
            ${{ env.UNIT_RESULTS }}/*.json
            ${{ env.UNIT_RESULTS }}/source-revision.txt
            ${{ env.UNIT_RESULTS }}/source-working-tree.patch
            ${{ env.UNIT_RESULTS }}/source-before-unit.patch
            ${{ env.UNIT_RESULTS }}/unit-tier.log
          if-no-files-found: error

      - name: Unit test duration + coverage report
        if: always() && env.UNIT_RESULTS != ''
        run: |
          BUNDLE=$(find "${UNIT_RESULTS:?}" -maxdepth 1 -name "*.xcresult" -type d | head -1)
          if [[ -n "$BUNDLE" ]]; then
            python3 scripts/ios/test-tier-report.py "$BUNDLE" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No unit-tier result bundle found to report on." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
