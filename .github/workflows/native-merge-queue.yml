name: Native Merge Queue Enrollment

# Every same-repo, non-draft PR to main enters the native queue once CI passes on its exact head.
# The queue re-runs CI on the merge group before landing; no extra labels or certification gates.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Draft-first PRs often go green while still drafts; enroll them when marked ready.
  pull_request_target:
    types: [ready_for_review]
    branches: [main]

permissions:
  actions: read
  contents: write # enqueuePullRequest is a merge-side mutation; read-only fails with "Resource not accessible by integration"
  pull-requests: write

concurrency:
  group: native-merge-queue-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  enroll:
    name: Enroll exact green head
    if: github.event_name == 'pull_request_target' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enqueue eligible pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # Events caused by GITHUB_TOKEN never start workflows, so a merge group
          # enqueued with it gets no CI and hits the 60-minute check timeout.
          # Use the machine-user token when present; fall back so outcomes still record.
          github-token: ${{ secrets.MERGE_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            let run = context.payload.workflow_run;
            if (context.eventName === 'pull_request_target') {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                event: 'pull_request',
                head_sha: context.payload.pull_request.head.sha,
                per_page: 1,
              });
              run = data.workflow_runs[0];
              if (!run || run.status !== 'completed') {
                core.notice('PENDING: CI has not completed for this head; enrollment follows CI completion');
                return;
              }
            }
            const recordOutcome = async (status, reason, details = '') => {
              core.notice(`${status}: ${reason}${details ? ` (${details})` : ''}`);
              await core.summary
                .addHeading('Native merge queue enrollment')
                .addTable([
                  [{ data: 'Status', header: true }, status],
                  [{ data: 'Reason', header: true }, reason],
                  [{ data: 'CI head', header: true }, run.head_sha],
                  [{ data: 'Details', header: true }, details || 'none'],
                ])
                .write();
            };

            if (run.conclusion !== 'success') {
              await recordOutcome('NOT_ELIGIBLE', 'CI did not pass', run.conclusion);
              return;
            }

            if (run.pull_requests.length !== 1) {
              await recordOutcome(
                'NOT_ELIGIBLE',
                'CI run did not resolve to exactly one pull request',
                `count=${run.pull_requests.length}`,
              );
              return;
            }

            const associated = run.pull_requests[0];
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: associated.number,
            });

            if (pull.base.ref !== 'main' || pull.draft || pull.state !== 'open') {
              await recordOutcome('NOT_ELIGIBLE', 'Pull request is not open and ready for main');
              return;
            }
            if (pull.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              await recordOutcome('NOT_ELIGIBLE', 'Fork pull requests cannot auto-enroll');
              return;
            }
            if (pull.head.sha !== run.head_sha) {
              await recordOutcome('STALE', 'Exact-head CI proof no longer matches the PR', pull.head.sha);
              return;
            }

            const result = await github.graphql(`
              mutation Enqueue($pullRequestId: ID!, $expectedHeadOid: GitObjectID!) {
                enqueuePullRequest(input: {
                  pullRequestId: $pullRequestId
                  expectedHeadOid: $expectedHeadOid
                }) {
                  mergeQueueEntry { id position }
                }
              }
            `, {
              pullRequestId: pull.node_id,
              expectedHeadOid: pull.head.sha,
            });

            await recordOutcome(
              'ENQUEUED',
              `Pull request #${pull.number} entered the repository-native queue`,
              `entry=${result.enqueuePullRequest.mergeQueueEntry.id} position=${result.enqueuePullRequest.mergeQueueEntry.position}`,
            );
