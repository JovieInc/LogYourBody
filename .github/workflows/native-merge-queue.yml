name: Native Merge Queue Enrollment

# Every same-repo, non-draft PR to main enters the native queue once CI passes on its exact head.
# Explicit hold labels block admission, including ready-for-review and transient retry events.
# The queue re-runs CI on the merge group before landing; no extra labels or certification gates.
# A PR the queue drops re-enters on the `dequeued` event when its head is unchanged and still
# green and the cause was transient (check timeout) or a first failed merge group. A second
# failed merge group at one head is a poison: it stays out and the lanes repair owner takes it.
# Manual and merge-conflict removals are never undone here.
# enqueuePullRequest refusals that are only a review block (changes requested, or
# missing required approving reviews) are NOT_ELIGIBLE: a notice and a green job.
# Merge-conflict and not-mergeable refusals are NOT_MERGEABLE: rebase in the PR's lane.
# Draft, permission, and every unexpected enqueue error still fail the job.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Draft-first PRs often go green while still drafts; enroll them when marked ready.
  # Converting an existing queue entry to draft does not itself remove that entry.
  pull_request_target:
    types: [ready_for_review, dequeued, converted_to_draft]
    branches: [main]

permissions:
  actions: read
  contents: write # enqueuePullRequest is a merge-side mutation; read-only fails with "Resource not accessible by integration"
  pull-requests: write

concurrency:
  group: native-merge-queue-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false
  # Keep draft withdrawal events instead of replacing the single pending run.
  # GitHub bounds this at 100 pending runs; admission failures remain visible.
  queue: max

jobs:
  enroll:
    name: Enroll exact green head
    if: github.event_name == 'pull_request_target' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enqueue eligible pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const expectedRepository = 'JovieInc/LogYourBody';
            if (`${context.repo.owner}/${context.repo.repo}` !== expectedRepository
                || !['workflow_run', 'pull_request_target'].includes(context.eventName)
                || (context.eventName === 'pull_request_target'
                  && !['ready_for_review', 'dequeued', 'converted_to_draft'].includes(context.payload.action))) {
              core.notice('NOT_ELIGIBLE: Event is outside the repository enrollment contract');
              return;
            }
            if (context.eventName === 'pull_request_target' && context.payload.action === 'converted_to_draft') {
              const eventPull = context.payload.pull_request;
              if (!Number.isSafeInteger(eventPull?.number) || eventPull.number <= 0
                  || eventPull.draft !== true || !/^[0-9a-f]{40}$/i.test(eventPull.head?.sha ?? '')) {
                core.notice('NOT_ELIGIBLE: Draft event is missing its exact pull request identity');
                return;
              }
              const query = `
                query DraftQueueEntry($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      id state isDraft baseRefName headRefOid
                      headRepository { nameWithOwner }
                      mergeQueueEntry { id position }
                    }
                  }
                }
              `;
              const variables = { owner: context.repo.owner, repo: context.repo.repo, number: eventPull.number };
              const current = (await github.graphql(query, variables)).repository?.pullRequest;
              const sameDraft = (pull) => pull?.state === 'OPEN' && pull.isDraft
                && pull.baseRefName === 'main' && pull.headRefOid === eventPull.head.sha
                && pull.headRepository?.nameWithOwner === expectedRepository;
              if (!sameDraft(current)) {
                core.notice(`NOT_ELIGIBLE: #${eventPull.number} is no longer the same open repository-local draft; no withdrawal performed`);
                return;
              }
              if (!Object.hasOwn(current, 'mergeQueueEntry')
                  || (current.mergeQueueEntry !== null
                    && (typeof current.mergeQueueEntry?.id !== 'string' || !current.mergeQueueEntry.id))) {
                throw new Error(`Could not verify draft withdrawal for #${eventPull.number}; queue membership is unknown`);
              }
              if (current.mergeQueueEntry === null) {
                core.notice(`WITHDRAWN: #${eventPull.number} at ${eventPull.head.sha} has no native queue entry (fresh readback)`);
                return;
              }
              await github.graphql(`
                mutation WithdrawDraft($id: ID!) {
                  dequeuePullRequest(input: { id: $id }) { mergeQueueEntry { id } }
                }
              `, { id: current.id });
              const after = (await github.graphql(query, variables)).repository?.pullRequest;
              if (!sameDraft(after) || !Object.hasOwn(after, 'mergeQueueEntry') || after.mergeQueueEntry !== null) {
                throw new Error(`Could not verify draft withdrawal for #${eventPull.number}; inspect current native queue membership`);
              }
              core.notice(`WITHDRAWN: #${eventPull.number} at ${eventPull.head.sha} removed from native queue and absence verified`);
              return;
            }
            let run = context.payload.workflow_run;
            if (context.eventName === 'pull_request_target') {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                event: 'pull_request',
                head_sha: context.payload.pull_request.head.sha,
                per_page: 1,
              });
              run = data.workflow_runs[0];
              if (!run || run.status !== 'completed') {
                core.notice('PENDING: CI has not completed for this head; enrollment follows CI completion');
                return;
              }
            }
            if (!run || run.name !== 'CI' || run.event !== 'pull_request'
                || run.status !== 'completed' || run.repository?.full_name !== expectedRepository) {
              core.notice('NOT_ELIGIBLE: Source is not completed repository-local PR CI');
              return;
            }
            const recordOutcome = async (status, reason, details = '') => {
              core.notice(`${status}: ${reason}${details ? ` (${details})` : ''}`);
              await core.summary
                .addHeading('Native merge queue enrollment')
                .addTable([
                  [{ data: 'Status', header: true }, status],
                  [{ data: 'Reason', header: true }, reason],
                  [{ data: 'CI head', header: true }, run.head_sha],
                  [{ data: 'Details', header: true }, details || 'none'],
                ])
                .write();
            };

            if (run.conclusion !== 'success') {
              await recordOutcome('NOT_ELIGIBLE', 'CI did not pass', run.conclusion);
              return;
            }

            if (run.pull_requests.length !== 1) {
              await recordOutcome(
                'NOT_ELIGIBLE',
                'CI run did not resolve to exactly one pull request',
                `count=${run.pull_requests.length}`,
              );
              return;
            }

            const associated = run.pull_requests[0];
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: associated.number,
            });

            if (pull.base.ref !== 'main' || pull.base.repo?.full_name !== expectedRepository
                || pull.draft || pull.state !== 'open') {
              await recordOutcome('NOT_ELIGIBLE', 'Pull request is not open and ready for main');
              return;
            }
            if (pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              await recordOutcome('NOT_ELIGIBLE', 'Fork pull requests cannot auto-enroll');
              return;
            }
            if (pull.head.sha !== run.head_sha) {
              await recordOutcome('STALE', 'Exact-head CI proof no longer matches the PR', pull.head.sha);
              return;
            }

            // Explicit holds are negative admission controls, never certification labels.
            const hasExplicitHold = !Array.isArray(pull.labels)
              || pull.labels.some(label => typeof label?.name !== 'string'
                || label.name.toLowerCase() === 'hold');
            if (hasExplicitHold) {
              await recordOutcome('NOT_ELIGIBLE', 'Pull request has an explicit hold or labels are unavailable');
              return;
            }

            if (context.eventName === 'pull_request_target' && context.payload.action === 'dequeued') {
              // Removals since this head's CI started belong to this head.
              const { repository: removed } = await github.graphql(`
                query Removals($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      timelineItems(last: 20, itemTypes: [REMOVED_FROM_MERGE_QUEUE_EVENT]) {
                        nodes { ... on RemovedFromMergeQueueEvent { createdAt reason } }
                      }
                    }
                  }
                }
              `, { owner: context.repo.owner, repo: context.repo.repo, number: pull.number });
              const removals = (removed?.pullRequest?.timelineItems?.nodes ?? [])
                .filter((item) => item?.createdAt && Date.parse(item.createdAt) >= Date.parse(run.created_at));
              const reason = String(removals.at(-1)?.reason ?? context.payload.reason ?? '').toLowerCase();
              const failedGroups = removals
                .filter((item) => String(item.reason).toLowerCase() === 'failed_checks').length;
              if (!['checks_timed_out', 'failed_checks'].includes(reason)) {
                await recordOutcome('NOT_ELIGIBLE', 'Queue removal was not transient', reason || 'unknown');
                return;
              }
              if (failedGroups >= 2) {
                await recordOutcome('POISONED', 'Merge group failed twice at this head; left for repair',
                  `failed_groups=${failedGroups}`);
                return;
              }
            }

            let result;
            try {
              result = await github.graphql(`
                mutation Enqueue($pullRequestId: ID!, $expectedHeadOid: GitObjectID!) {
                  enqueuePullRequest(input: {
                    pullRequestId: $pullRequestId
                    expectedHeadOid: $expectedHeadOid
                  }) {
                    mergeQueueEntry { id position }
                  }
                }
              `, {
                pullRequestId: pull.node_id,
                expectedHeadOid: pull.head.sha,
              });
            } catch (error) {
              const errors = Array.isArray(error?.errors) ? error.errors : [];
              // Only known review/mergeability refusals are PR-level ineligibility.
              // Require every clause to be known so mixed API failures still throw.
              const reviewClause = /^(?:Pull request \d+ reviews? requesting changes by reviewers with write access|At least \d+ approving reviews? (?:(?:is|are) )?required by reviewers with write access)\.?$/;
              const mergeabilityClause = /^Pull request (?:has merge conflicts|not in mergeable state)\.?$/;
              const clauses = errors.flatMap((failure) => String(failure?.message ?? '')
                .split(/ and (?=(?:Pull request|At least)\b)/).map((clause) => clause.trim()));
              const policyBlocking = errors.length > 0
                && errors.every((failure) => failure?.type === 'UNPROCESSABLE')
                && clauses.every((clause) => reviewClause.test(clause) || mergeabilityClause.test(clause));
              if (policyBlocking) {
                const notMergeable = clauses.some((clause) => mergeabilityClause.test(clause));
                await recordOutcome(
                  notMergeable ? 'NOT_MERGEABLE' : 'NOT_ELIGIBLE',
                  notMergeable ? `Pull request #${pull.number} needs rebase or mergeability repair in its lane`
                    : 'Pull request is blocked by review',
                  errors.map((failure) => failure.message).filter(Boolean).join('; '),
                );
                return;
              }
              const alreadyQueued = errors.length > 0 && errors.every((failure) => failure?.type === 'UNPROCESSABLE'
                && /^Pull request is already in the queue\.?$/.test(failure.message ?? ''));
              if (!alreadyQueued) throw error;
              const { repository } = await github.graphql(`
                query EnqueuedHead($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      state isDraft baseRefName headRefOid
                      headRepository { nameWithOwner }
                      mergeQueueEntry { id position }
                    }
                  }
                }
              `, { owner: context.repo.owner, repo: context.repo.repo, number: pull.number });
              const queued = repository?.pullRequest;
              if (!queued?.mergeQueueEntry || queued.headRefOid !== pull.head.sha
                  || queued.state !== 'OPEN' || queued.isDraft || queued.baseRefName !== 'main'
                  || queued.headRepository?.nameWithOwner !== expectedRepository) throw error;
              await recordOutcome('ENQUEUED', `Pull request #${pull.number} is already in the repository-native queue`,
                `entry=${queued.mergeQueueEntry.id} position=${queued.mergeQueueEntry.position}`);
              return;
            }

            await recordOutcome(
              'ENQUEUED',
              `Pull request #${pull.number} entered the repository-native queue`,
              `entry=${result.enqueuePullRequest.mergeQueueEntry.id} position=${result.enqueuePullRequest.mergeQueueEntry.position}`,
            );
