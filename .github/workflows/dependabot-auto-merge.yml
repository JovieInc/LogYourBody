# Thin caller — keep in sync via ~/.hermes/scripts/sync-ship-github-workflows.py
name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  call:
    uses: JovieInc/ci/.github/workflows/dependabot-auto-merge.yml@main
    with:
      # Enrollment itself is exact-head and does not read this label.
      # The shared workflow still applies it to patch and minor Dependabot PRs.
      certification_labels: 'machine-certified'
