name: CI

on:
  pull_request:
    branches: [main, production]
  merge_group:
    branches: [main, production]
    types: [checks_requested]
  push:
    branches: [main]

concurrency:
  # Main-branch runs must not cancel each other. A rapid second merge can
  # otherwise kill the release/deploy evidence for the first merge.
  group: >-
    ci-${{ github.workflow }}-${{
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
        && github.sha
        || github.ref
    }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.ref != 'refs/heads/main' }}

jobs:
  mac-runner-route:
    name: Mac Runner Route
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      runner_class: ${{ steps.route.outputs.runner_class }}
    steps:
      - name: Checkout trusted runner routing policy
        if: ${{ vars.MAC_RUNNER == 'on' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/await-runner-heartbeat.sh
            .github/scripts/query-runner-heartbeat.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Query Mac runner heartbeat
        id: heartbeat
        if: ${{ vars.MAC_RUNNER == 'on' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEARTBEAT_WORKFLOW: mac-runner-heartbeat.yml
          HEARTBEAT_MAX_AGE_SECONDS: '1500'
          HEARTBEAT_API_TIMEOUT_SECONDS: '5'
          HEARTBEAT_POLL_ATTEMPTS: '1'
          HEARTBEAT_POLL_INTERVAL_SECONDS: '1'
        run: |
          set -uo pipefail
          helper='.github/scripts/await-runner-heartbeat.sh'
          if [ -x "$helper" ]; then
            timeout 60s "$helper" || true
          fi
          exit 0

      - name: Select Mac runner route
        id: route
        env:
          HEARTBEAT_HEALTH: ${{ steps.heartbeat.outputs.health }}
          HEARTBEAT_EVIDENCE: ${{ steps.heartbeat.outputs.evidence }}
        shell: bash
        run: |
          set -euo pipefail
          runner_class='hosted'
          if [ "$HEARTBEAT_HEALTH" = 'up' ]; then
            runner_class='mac'
          fi
          echo "runner_class=$runner_class" >> "$GITHUB_OUTPUT"
          echo "::notice::LogYourBody iOS runner route: $runner_class — ${HEARTBEAT_EVIDENCE:-not probed}"

  mac-runner-routing-tests:
    name: Mac Runner Routing Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Install routing test tools
        run: |
          python3 -m pip install --user pytest==8.4.2
          gem install bashcov -v 4.0.0 --no-document

      - name: Test heartbeat routing with shell coverage
        run: |
          rm -f coverage/mac-runner-routing/.resultset.json
          bashcov --command-name mac-runner-routing -- -c 'python3 -m pytest -p no:cacheprovider scripts/tests/test_runner_routing.py -q'
          python3 scripts/tests/test_runner_routing.py

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify workflow concurrency policy
        run: node .github/scripts/verify-workflow-concurrency.mjs

      - name: Verify repository merge queue policy
        run: node --test .github/scripts/verify-merge-queue-policy.test.mjs

      - name: Verify live branch ruleset targets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --test .github/scripts/verify-ruleset-targets.test.mjs && node .github/scripts/verify-ruleset-targets.mjs

      - name: Detect changed surfaces locally
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            changed_files=$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
          else
            diff_base="$BASE_SHA"
            if ! git cat-file -e "$diff_base^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=100 origin main
            fi
            if ! git cat-file -e "$diff_base^{commit}" 2>/dev/null; then
              diff_base='origin/main'
            fi
            changed_files=$(git diff --name-only "$diff_base" "$HEAD_SHA")
          fi

          web_pattern='^(agent/|evals/|apps/web/|packages/|\.github/actions/|\.github/scripts/|\.github/workflows/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|scripts/|turbo\.json$)'
          ios_pattern='^(apps/ios/|\.github/actions/setup-ios-build/|\.github/workflows/ci\.yml$|\.github/workflows/ios[^/]*\.yml$|scripts/ios/|package\.json$)'

          if printf '%s\n' "$changed_files" | grep -Eq "$web_pattern"; then
            echo 'web=true' >> "$GITHUB_OUTPUT"
          else
            echo 'web=false' >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$changed_files" | grep -Eq "$ios_pattern"; then
            echo 'ios=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ios=false' >> "$GITHUB_OUTPUT"
          fi

  js:
    name: JavaScript/TypeScript
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint curated knowledge artifacts
        run: pnpm lint:knowledge

      - name: Test knowledge identity lint
        run: pnpm test:knowledge-lint

      - name: Check vendor boundaries
        run: pnpm check:vendor-boundaries

      - name: Lint
        run: pnpm lint

      - name: Neon migration layout checks
        run: pnpm db:schema:check

      - name: Type check
        run: pnpm typecheck

      - name: Test release source validation
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include=.github/scripts/validate-release-checks.mjs
          --test-coverage-lines=90 --test-coverage-branches=90 --test-coverage-functions=90
          .github/scripts/validate-release-source.test.mjs

      - name: Test
        run: pnpm test:ci

  ios:
    name: iOS
    runs-on: ${{ needs.mac-runner-route.outputs.runner_class == 'mac' && fromJSON('["self-hosted","macOS","ARM64","jovie-mac"]') || 'macos-15' }}
    needs: [detect-changes, mac-runner-route]
    if: needs.detect-changes.outputs.ios == 'true'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup iOS build environment
        uses: ./.github/actions/setup-ios-build
        with:
          xcode-version: 'latest-stable'
          working-directory: apps/ios
          setup-ruby: 'true'
          create-config-files: 'true'

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: |
            apps/ios/.build
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-xcode-stable-${{ hashFiles('**/Package.resolved', '**/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-xcode-stable-
            ${{ runner.os }}-spm-

      - name: Fastlane iOS CI
        run: |
          cd apps/ios
          bundle exec fastlane ci_ios

      - name: Unit-tier tests
        run: |
          cd apps/ios
          DESTINATION=$(SCHEME=LogYourBodyTiers bash ../../scripts/ios/resolve-simulator-destination.sh)
          bundle exec fastlane ci_test_unit destination:"$DESTINATION"

      - name: Unit test duration + coverage report
        if: always()
        run: |
          BUNDLE=$(ls -d apps/ios/test_results/unit-tier/*.xcresult 2>/dev/null | head -1 || true)
          if [[ -n "$BUNDLE" ]]; then
            python3 scripts/ios/test-tier-report.py "$BUNDLE" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No unit-tier result bundle found to report on." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  ios_quality:
    name: iOS Launch Quality Gate
    runs-on: ${{ needs.mac-runner-route.outputs.runner_class == 'mac' && fromJSON('["self-hosted","macOS","ARM64","jovie-mac"]') || 'macos-15' }}
    needs: [detect-changes, mac-runner-route]
    if: needs.detect-changes.outputs.ios == 'true'
    # Setup plus one 40-minute audit plus the 8-minute performance cap.
    timeout-minutes: 52
    steps:
      - uses: actions/checkout@v4

      - name: Setup iOS build environment
        uses: ./.github/actions/setup-ios-build
        with:
          xcode-version: 'latest-stable'
          working-directory: apps/ios
          setup-ruby: 'true'
          create-config-files: 'true'

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: |
            apps/ios/.build
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-quality-spm-xcode-latest-stable-${{ hashFiles('**/Package.resolved', '**/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-quality-spm-xcode-latest-stable-
            ${{ runner.os }}-spm-

      - name: Run launch quality audit
        # Slow prefix plus the full chaos regression suite. The script does not
        # retry a command timeout, so this budget is for a single attempt.
        timeout-minutes: 40
        env:
          DESTINATION: auto
          ARTIFACT_DIR: ${{ github.workspace }}/apps/ios/test_results/quality-gate/ci-${{ github.run_id }}/launch-quality
        run: bash scripts/ios/launch-quality-audit.sh

      - name: Run performance budget audit
        timeout-minutes: 8
        env:
          DESTINATION: auto
          RUN_SWIFTLINT: false
          RUN_LAUNCH_PERFORMANCE: false
          ARTIFACT_DIR: ${{ github.workspace }}/apps/ios/test_results/quality-gate/ci-${{ github.run_id }}/performance
        run: bash scripts/ios/performance-audit.sh

      - name: Upload quality gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-launch-quality-gate-${{ github.run_id }}
          path: apps/ios/test_results/quality-gate/ci-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [detect-changes, mac-runner-routing-tests, js, ios, ios_quality]
    steps:
      - name: Check results
        run: |
          assert_expected_result() {
            local job_name="$1"
            local changed="$2"
            local result="$3"
            local expected="skipped"

            if [[ "$changed" == "true" ]]; then
              expected="success"
            fi

            if [[ "$result" != "$expected" ]]; then
              echo "::error::$job_name result was '$result'; expected '$expected' (changed=$changed)"
              return 1
            fi
          }

          {
            echo "## CI Summary"
            echo ""
            echo "- Web changed: ${{ needs.detect-changes.outputs.web }}"
            echo "- iOS changed: ${{ needs.detect-changes.outputs.ios }}"
            echo "- iOS quality gate: ${{ needs.ios_quality.result }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.detect-changes.result }}" != "success" ]] || \
             [[ "${{ needs.mac-runner-routing-tests.result }}" != "success" ]] || \
             ! assert_expected_result "JavaScript/TypeScript" "${{ needs.detect-changes.outputs.web }}" "${{ needs.js.result }}" || \
             ! assert_expected_result "iOS" "${{ needs.detect-changes.outputs.ios }}" "${{ needs.ios.result }}" || \
             ! assert_expected_result "iOS Launch Quality Gate" "${{ needs.detect-changes.outputs.ios }}" "${{ needs.ios_quality.result }}"; then
            echo "❌ One or more CI jobs failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ All CI checks passed!" >> "$GITHUB_STEP_SUMMARY"
