name: CI

on:
  pull_request:
    branches: [main, production]
    # ready_for_review reruns CI on the same head so a draft's deferred Launch Quality runs.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main, production]
    types: [checks_requested]
  push:
    branches: [main]

concurrency:
  # Main-branch runs must not cancel each other. A rapid second merge can
  # otherwise kill the release/deploy evidence for the first merge.
  group: >-
    ci-${{ github.workflow }}-${{
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
        && github.sha
        || github.ref
    }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.ref != 'refs/heads/main' }}

jobs:
  mac-runner-routing-tests:
    name: Mac Runner Routing Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Install routing test tools
        run: |
          python3 -m pip install --user pytest==8.4.2
          gem install bashcov -v 4.0.0 --no-document

      - name: Test Mac runner routing with shell coverage
        run: |
          rm -f coverage/mac-runner-routing/.resultset.json
          bashcov --command-name mac-runner-routing -- -c 'python3 -m pytest -p no:cacheprovider scripts/tests/test_runner_routing.py -q'
          python3 scripts/tests/test_runner_routing.py

  cancel-superseded-merge-groups:
    name: Cancel Superseded Merge Groups
    # When the queue drops or rebuilds a group it deletes the gh-readonly-queue ref, but
    # the old CI run keeps queueing and holding macOS runners. Sweep again at the end of
    # each group, after GitHub has deleted any replaced refs.
    # Advisory: never fails CI.
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Cancel CI runs for deleted merge-group refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/cancel-superseded-merge-groups.sh

  merge-group-fail-fast:
    name: Merge Group Fail Fast
    # CI Summary (the required check) waits for every job, so a group whose
    # Linux jobs already failed kept two macOS runners busy for 20-60 min
    # before the queue could eject it. Cancel the rest of the run instead:
    # CI Summary still runs (if: always()) and fails at once.
    needs: [detect-changes, mac-runner-routing-tests, js]
    if: github.event_name == 'merge_group' && failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel the rest of this merge-group run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      ios_changed: ${{ steps.filter.outputs.ios_changed }}
      ios_unit: ${{ steps.filter.outputs.ios_unit }}
      ios_quality: ${{ steps.filter.outputs.ios_quality }}
      ios_quality_deferred: ${{ steps.filter.outputs.ios_quality_deferred }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify workflow concurrency policy
        run: node .github/scripts/verify-workflow-concurrency.mjs

      - name: Verify repository merge queue policy
        run: node --test .github/scripts/verify-merge-queue-policy.test.mjs

      - name: Verify live branch ruleset targets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --test .github/scripts/verify-ruleset-targets.test.mjs && node .github/scripts/verify-ruleset-targets.mjs

      # Whole-repo invariant: a docs-only change can add an unregistered URL, so this runs
      # on every change instead of only inside the js job.
      - name: Verify URL registry covers the whole repo
        run: node packages/product-registry/scripts/url-drift.test.mjs

      - name: Test change detection and the CI Summary gate
        run: node --test .github/scripts/detect-changes.test.mjs

      - name: Test agent environment lifecycle with coverage
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include=scripts/codex-setup.mjs
          --test-coverage-lines=90 --test-coverage-branches=90 --test-coverage-functions=100
          scripts/codex-setup.test.mjs

      - name: Test post-merge Launch Quality
        run: node --test .github/scripts/post-merge-quality.test.mjs

      - name: Verify LYB correction coverage against the base revision
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          node --test packages/shared-lib/scripts/correction-coverage.behavior.mjs
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node packages/shared-lib/scripts/correction-coverage.mjs --base-ref "$BASE_SHA"

      - name: Detect changed surfaces locally
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: bash .github/scripts/detect-changes.sh

  js:
    name: JavaScript/TypeScript
    # Disposable SQL qualification requires this image's PostgreSQL16 binaries.
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint curated knowledge artifacts
        run: pnpm lint:knowledge

      - name: Test knowledge identity lint
        run: pnpm test:knowledge-lint

      - name: Check vendor boundaries
        run: pnpm check:vendor-boundaries

      - name: Lint
        run: pnpm lint

      - name: Neon migration layout checks
        run: pnpm db:schema:check

      - name: Verify training mutations on disposable PostgreSQL16
        shell: bash
        timeout-minutes: 5
        run: |
          mkdir -p artifacts/training-mutations/coverage
          git rev-parse HEAD > artifacts/training-mutations/source-revision.txt
          sha256sum apps/web/db/tests/verify-training-mutations.py apps/web/db/migrations/*.sql apps/web/src/lib/neon/user-directory-adapter.ts apps/web/src/lib/neon/native-account-admission.ts > artifacts/training-mutations/source-sha256.txt
          python3 -m trace --count --summary --missing \
            --ignore-dir "$(python3 -c 'import sys; print(sys.prefix)')" \
            --coverdir artifacts/training-mutations/coverage \
            apps/web/db/tests/verify-training-mutations.py --postgres-bin /usr/lib/postgresql/16/bin \
            | tee artifacts/training-mutations/results.log

      - name: Upload training mutation execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-mutations-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/training-mutations
          if-no-files-found: warn

      - name: Verify reported measurements on disposable PostgreSQL16
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p artifacts/reported-measurements/coverage
          git rev-parse HEAD > artifacts/reported-measurements/source-revision.txt
          sha256sum scripts/neon/test-reported-measurements.py apps/web/db/migrations/20260813130000_native_product_records.sql apps/web/src/lib/neon/native-product-records-adapter.ts apps/web/src/lib/ports/reported-measurements.ts > artifacts/reported-measurements/source-sha256.txt
          python3 -m trace --count --summary --missing \
            --ignore-dir "$(python3 -c 'import sys; print(sys.prefix)')" \
            --coverdir artifacts/reported-measurements/coverage \
            scripts/neon/test-reported-measurements.py --run --postgres-bin /usr/lib/postgresql/16/bin \
            | tee artifacts/reported-measurements/results.log

      - name: Verify daily step deletions on disposable PostgreSQL16
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          evidence=artifacts/reported-measurements/daily-step-deletions
          mkdir -p "$evidence/coverage"
          git rev-parse HEAD > "$evidence/source-revision.txt"
          sha256sum scripts/neon/verify-daily-step-deletions.py apps/web/src/lib/neon/native-product-records-adapter.ts apps/web/src/lib/neon/native-account-admission.ts apps/web/db/migrations/20260714183000_create_app_users.sql apps/web/db/migrations/20260813130000_native_product_records.sql apps/web/db/migrations/20261010120000_native_account_admission.sql > "$evidence/source-sha256.txt"
          python3 -m trace --count --summary --missing \
            --ignore-dir "$(python3 -c 'import sys; print(sys.prefix)')" \
            --coverdir "$evidence/coverage" \
            scripts/neon/verify-daily-step-deletions.py --run --postgres-bin /usr/lib/postgresql/16/bin \
            | tee "$evidence/results.log"
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          root = pathlib.Path.cwd()
          evidence = root / "artifacts/reported-measurements/daily-step-deletions"
          reports = [json.loads(line) for line in (evidence / "results.log").read_text().splitlines() if line.startswith("{")]
          assert len(reports) == 1, "Expected one completed deletion report"
          report = reports[0]
          expected = [
              'DELETE then different-ID POST waits on actual account lock and retains unrelated fields',
              'POST then different-ID DELETE waits on actual account lock and retains unrelated fields',
              'same-ID stale replay cannot move or erase marker/date/notes/unknown JSON',
              'different-ID recorded zero and positive imports inherit the owner/day marker',
              'repeat deletion accepts equivalent offset instants and retains original marker',
              'half-open end leaves the following day unchanged',
              "foreign-ID collision cannot change anchor or authorize another owner's day deletion",
              "different owner completes while first owner's lock remains held",
              'later transaction failure rolls back marker and every daily write',
              'captured old account incarnation cannot create a deletion marker',
          ]
          assert report["passed"] == 10 and report["checks"] == expected, "Incomplete or changed deletion contracts"
          assert report["liveDatabase"] is False
          schedules = [name.split(" waits on")[0] for name in expected[:2]]
          assert report["lockObservations"] == [
              {"schedule": name, "waitEventType": "Lock", "actualHolderInBlockingPids": True} for name in schedules
          ], "Missing actual owner-lock observations"
          assert set(report["postgresTools"]) == {"initdb", "pg_ctl", "psql"}
          assert all(re.search(r"\(PostgreSQL\) 16(?:\.|$)", version) for version in report["postgresTools"].values())
          recorded = {}
          for line in (evidence / "source-sha256.txt").read_text().splitlines():
              digest, name = line.split(maxsplit=1)
              recorded[name] = digest
          sources = [
              'scripts/neon/verify-daily-step-deletions.py',
              'apps/web/src/lib/neon/native-product-records-adapter.ts',
              'apps/web/src/lib/neon/native-account-admission.ts',
              'apps/web/db/migrations/20260714183000_create_app_users.sql',
              'apps/web/db/migrations/20260813130000_native_product_records.sql',
              'apps/web/db/migrations/20261010120000_native_account_admission.sql',
          ]
          assert set(recorded) == set(sources), "Incomplete source inventory"
          assert re.fullmatch(r"[0-9a-f]{40}", (evidence / "source-revision.txt").read_text().strip())
          assert all(hashlib.sha256((root / name).read_bytes()).hexdigest() == recorded[name] for name in sources)
          assert report["sourceSha256"] == {str(root / name): recorded[name] for name in sources[1:]}, "Report source mismatch"
          print("Verified 10 deletion contracts, 2 owner-lock observations, PostgreSQL16 tools and exact source")
          PY

      - name: Upload reported measurement execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reported-measurements-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/reported-measurements
          if-no-files-found: warn

      - name: Type check
        run: pnpm typecheck

      - name: Test release source validation
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include=.github/scripts/validate-release-checks.mjs
          --test-coverage-lines=90 --test-coverage-branches=90 --test-coverage-functions=90
          .github/scripts/validate-release-source.test.mjs
          .github/scripts/ios-release-tag.test.mjs
          .github/scripts/fastlane-log-failures.test.mjs

      - name: Test
        run: pnpm test:ci

  ios:
    name: iOS
    needs: detect-changes
    if: needs.detect-changes.outputs.ios_unit == 'true'
    # An idle self-hosted Mac first (cancellable child run), hosted macOS
    # otherwise; a busy, asleep or offline Mac never holds this job.
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/ios-unit.yml
    with:
      mac-first: true
      supersede-key: ${{ github.head_ref || '' }}

  ios_quality:
    name: iOS Launch Quality Gate
    needs: detect-changes
    if: needs.detect-changes.outputs.ios_quality == 'true'
    # An idle self-hosted Mac first (cancellable child run), hosted macOS
    # otherwise; a busy, asleep or offline Mac never holds this job.
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/ios-quality.yml
    with:
      # Hosted until the launch-quality capture tests pass on the Macs: four
      # LaunchQualityGate capture tests failed on every self-hosted run
      # (2026-10-12, tw-mac-001 and tims-macbook-air) and pass hosted.
      mac-first: false
      supersede-key: ${{ github.head_ref || '' }}

  ios_storekit:
    name: iOS StoreKit Purchase and Restore
    needs: detect-changes
    # Always produce fresh main evidence, even when Unit was deduplicated against a merge group.
    if: github.event_name == 'push' || needs.detect-changes.outputs.ios_changed == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup simulator build environment
        uses: ./.github/actions/setup-ios-build
        with:
          xcode-version: 'latest-stable'
          working-directory: apps/ios
          setup-ruby: 'false'
          create-config-files: 'true'

      - name: StoreKit purchase and restore evidence
        run: bash scripts/ios/storekit-purchase-restore.sh

      - name: Upload StoreKit execution and coverage receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-storekit-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/ios/test_results/storekit/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [detect-changes, mac-runner-routing-tests, js, ios, ios_quality, ios_storekit]
    steps:
      - name: Check results
        run: |
          assert_expected_result() {
            local job_name="$1"
            local changed="$2"
            local result="$3"
            local expected="skipped"

            if [[ "$changed" == "true" ]]; then
              expected="success"
            fi

            if [[ "$result" != "$expected" ]]; then
              echo "::error::$job_name result was '$result'; expected '$expected' (changed=$changed)"
              return 1
            fi
          }

          storekit_expected=false
          if [[ "${{ github.event_name }}" == "push" || "${{ needs.detect-changes.outputs.ios_changed }}" == "true" ]]; then
            storekit_expected=true
          fi

          {
            echo "## CI Summary"
            echo ""
            echo "- Web changed: ${{ needs.detect-changes.outputs.web }}"
            echo "- iOS changed: ${{ needs.detect-changes.outputs.ios_changed }}"
            echo "- iOS Unit runs here: ${{ needs.detect-changes.outputs.ios_unit }}"
            echo "- iOS Launch Quality runs here: ${{ needs.detect-changes.outputs.ios_quality }} (deferred for draft: ${{ needs.detect-changes.outputs.ios_quality_deferred }})"
            echo "- iOS quality gate: ${{ needs.ios_quality.result }}"
            echo "- iOS StoreKit purchase and restore: ${{ needs.ios_storekit.result }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.detect-changes.result }}" != "success" ]] || \
             [[ "${{ needs.mac-runner-routing-tests.result }}" != "success" ]] || \
             ! assert_expected_result "JavaScript/TypeScript" "${{ needs.detect-changes.outputs.web }}" "${{ needs.js.result }}" || \
             ! assert_expected_result "iOS" "${{ needs.detect-changes.outputs.ios_unit }}" "${{ needs.ios.result }}" || \
             ! assert_expected_result "iOS StoreKit" "$storekit_expected" "${{ needs.ios_storekit.result }}" || \
             ! assert_expected_result "iOS Launch Quality Gate" "${{ needs.detect-changes.outputs.ios_quality }}" "${{ needs.ios_quality.result }}"; then
            echo "❌ One or more CI jobs failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ All CI checks passed!" >> "$GITHUB_STEP_SUMMARY"

  cancel-superseded-merge-groups-final:
    name: Cancel Superseded Merge Groups (group end)
    if: always() && github.event_name == 'merge_group'
    needs: [ci-summary]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Cancel CI runs for deleted merge-group refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/cancel-superseded-merge-groups.sh
