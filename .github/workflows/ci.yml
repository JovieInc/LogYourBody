name: CI

on:
  pull_request:
    branches: [main, production]
    # ready_for_review reruns CI on the same head so a draft's deferred Launch Quality runs.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main, production]
    types: [checks_requested]
  push:
    branches: [main]

concurrency:
  # Main-branch runs must not cancel each other. A rapid second merge can
  # otherwise kill the release/deploy evidence for the first merge.
  group: >-
    ci-${{ github.workflow }}-${{
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
        && github.sha
        || github.ref
    }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.ref != 'refs/heads/main' }}

jobs:
  mac-runner-routing-tests:
    name: Mac Runner Routing Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Install routing test tools
        run: |
          python3 -m pip install --user pytest==8.4.2
          gem install bashcov -v 4.0.0 --no-document

      - name: Test Mac runner routing with shell coverage
        run: |
          rm -f coverage/mac-runner-routing/.resultset.json
          bashcov --command-name mac-runner-routing -- -c 'python3 -m pytest -p no:cacheprovider scripts/tests/test_runner_routing.py -q'
          python3 scripts/tests/test_runner_routing.py

  cancel-superseded-merge-groups:
    name: Cancel Superseded Merge Groups
    # When the queue drops or rebuilds a group it deletes the gh-readonly-queue ref, but
    # the old CI run keeps queueing and holding macOS runners. Each new group cancels
    # merge-group CI runs whose ref no longer exists. GitHub deletes the old refs a few
    # seconds after starting the new group, so a second pass runs 90s later.
    # Advisory: never fails CI.
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel CI runs for deleted merge-group refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          sweep() {
            for status in queued in_progress waiting pending; do
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=merge_group&status=$status&per_page=100" \
                --jq '.workflow_runs[] | "\(.id) \(.head_branch)"'
            done | sort -u | while read -r run_id branch; do
              [[ "$run_id" == "$GITHUB_RUN_ID" || "$branch" != gh-readonly-queue/* ]] && continue
              # Only a definitive 404 proves the group is gone; any other error leaves the run.
              # Capture first: under pipefail, `gh ... | grep -q` returns gh's 404 exit status
              # even when grep matches, so the sweep never cancelled anything.
              # Actions runs this under bash -e, so a 404 (gh exits 1) must not end the step.
              ref_lookup=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --silent 2>&1) || true
              if grep -q 'HTTP 404' <<<"$ref_lookup"; then
                gh run cancel "$run_id" -R "$GITHUB_REPOSITORY" && echo "Cancelled superseded run $run_id ($branch)"
              fi
            done
          }
          sweep
          sleep 90
          sweep

  merge-group-fail-fast:
    name: Merge Group Fail Fast
    # CI Summary (the required check) waits for every job, so a group whose
    # Linux jobs already failed kept two macOS runners busy for 20-60 min
    # before the queue could eject it. Cancel the rest of the run instead:
    # CI Summary still runs (if: always()) and fails at once.
    needs: [detect-changes, mac-runner-routing-tests, js]
    if: github.event_name == 'merge_group' && failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel the rest of this merge-group run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      ios_changed: ${{ steps.filter.outputs.ios_changed }}
      ios_unit: ${{ steps.filter.outputs.ios_unit }}
      ios_quality: ${{ steps.filter.outputs.ios_quality }}
      ios_quality_deferred: ${{ steps.filter.outputs.ios_quality_deferred }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify workflow concurrency policy
        run: node .github/scripts/verify-workflow-concurrency.mjs

      - name: Verify repository merge queue policy
        run: node --test .github/scripts/verify-merge-queue-policy.test.mjs

      - name: Verify live branch ruleset targets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --test .github/scripts/verify-ruleset-targets.test.mjs && node .github/scripts/verify-ruleset-targets.mjs

      - name: Test change detection and the CI Summary gate
        run: node --test .github/scripts/detect-changes.test.mjs

      - name: Test post-merge Launch Quality
        run: node --test .github/scripts/post-merge-quality.test.mjs

      - name: Detect changed surfaces locally
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: bash .github/scripts/detect-changes.sh

  js:
    name: JavaScript/TypeScript
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint curated knowledge artifacts
        run: pnpm lint:knowledge

      - name: Test knowledge identity lint
        run: pnpm test:knowledge-lint

      - name: Check vendor boundaries
        run: pnpm check:vendor-boundaries

      - name: Lint
        run: pnpm lint

      - name: Neon migration layout checks
        run: pnpm db:schema:check

      - name: Type check
        run: pnpm typecheck

      - name: Test release source validation
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include=.github/scripts/validate-release-checks.mjs
          --test-coverage-lines=90 --test-coverage-branches=90 --test-coverage-functions=90
          .github/scripts/validate-release-source.test.mjs

      - name: Test
        run: pnpm test:ci

  ios:
    name: iOS
    needs: detect-changes
    if: needs.detect-changes.outputs.ios_unit == 'true'
    # An idle self-hosted Mac first (cancellable child run), hosted macOS
    # otherwise; a busy, asleep or offline Mac never holds this job.
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/ios-unit.yml
    with:
      mac-first: true
      supersede-key: ${{ github.head_ref || '' }}

  ios_quality:
    name: iOS Launch Quality Gate
    needs: detect-changes
    if: needs.detect-changes.outputs.ios_quality == 'true'
    # An idle self-hosted Mac first (cancellable child run), hosted macOS
    # otherwise; a busy, asleep or offline Mac never holds this job.
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/ios-quality.yml
    with:
      # Hosted until the launch-quality capture tests pass on the Macs: four
      # LaunchQualityGate capture tests failed on every self-hosted run
      # (2026-10-12, tw-mac-001 and tims-macbook-air) and pass hosted.
      mac-first: false
      supersede-key: ${{ github.head_ref || '' }}

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [detect-changes, mac-runner-routing-tests, js, ios, ios_quality]
    steps:
      - name: Check results
        run: |
          assert_expected_result() {
            local job_name="$1"
            local changed="$2"
            local result="$3"
            local expected="skipped"

            if [[ "$changed" == "true" ]]; then
              expected="success"
            fi

            if [[ "$result" != "$expected" ]]; then
              echo "::error::$job_name result was '$result'; expected '$expected' (changed=$changed)"
              return 1
            fi
          }

          {
            echo "## CI Summary"
            echo ""
            echo "- Web changed: ${{ needs.detect-changes.outputs.web }}"
            echo "- iOS changed: ${{ needs.detect-changes.outputs.ios_changed }}"
            echo "- iOS Unit runs here: ${{ needs.detect-changes.outputs.ios_unit }}"
            echo "- iOS Launch Quality runs here: ${{ needs.detect-changes.outputs.ios_quality }} (deferred for draft: ${{ needs.detect-changes.outputs.ios_quality_deferred }})"
            echo "- iOS quality gate: ${{ needs.ios_quality.result }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.detect-changes.result }}" != "success" ]] || \
             [[ "${{ needs.mac-runner-routing-tests.result }}" != "success" ]] || \
             ! assert_expected_result "JavaScript/TypeScript" "${{ needs.detect-changes.outputs.web }}" "${{ needs.js.result }}" || \
             ! assert_expected_result "iOS" "${{ needs.detect-changes.outputs.ios_unit }}" "${{ needs.ios.result }}" || \
             ! assert_expected_result "iOS Launch Quality Gate" "${{ needs.detect-changes.outputs.ios_quality }}" "${{ needs.ios_quality.result }}"; then
            echo "❌ One or more CI jobs failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ All CI checks passed!" >> "$GITHUB_STEP_SUMMARY"
