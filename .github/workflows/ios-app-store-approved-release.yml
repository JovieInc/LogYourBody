name: iOS App Store Approved Release

# Apple App Review state changes in App Store Connect and emits no GitHub event
# here. The cron is the backstop. GitHub delivers `*/30` hours late. Scheduled
# runs from 2026-10-28 15:17Z through 2026-11-01 17:12Z started about 3-7 hours apart
# (20:26Z, 00:11Z, 06:09Z, and 13:28Z on Oct 28-29 are in that range). LYB-139's
# health gate uses that gap as the latency for a release request and for pausing
# a rollout. The prompt path still to build is an App Store Connect
# appStoreVersion webhook bridged to repository_dispatch. This job checks
# release health before releasing and throughout phased rollout. Unhealthy or
# unverified active rollouts are paused and tracked in an issue.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Optional App Store version to release after Apple approval. Leave empty to release any PENDING_DEVELOPER_RELEASE version.'
        required: false
        type: string

concurrency:
  group: ios-app-store-approved-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-approved-version:
    name: Release Approved App Store Version
    if: github.ref == 'refs/heads/main'
    # Ruby 3.1 has prebuilt archives for Ubuntu 24.04, but not Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Ruby and Bundler
        uses: ./.github/actions/setup-ruby-bundler
        with:
          working-directory: apps/ios
          cache-key-prefix: ios-release-monitor-gems

      - name: Setup App Store Connect Authentication
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          cd apps/ios
          mkdir -p fastlane

          ruby <<'RUBY'
          require "json"

          api_key = {
            "key_id" => ENV.fetch("ASC_KEY_ID"),
            "issuer_id" => ENV.fetch("ASC_ISSUER_ID"),
            "key" => ENV.fetch("ASC_PRIVATE_KEY").gsub("\\n", "\n"),
            "duration" => 1200,
            "in_house" => false
          }

          File.write("fastlane/api_key.json", JSON.pretty_generate(api_key))
          JSON.parse(File.read("fastlane/api_key.json"))
          RUBY

          echo "APP_STORE_CONNECT_API_KEY_PATH=$(pwd)/fastlane/api_key.json" >> "$GITHUB_ENV"

      - name: Resolve App Version
        id: app_version
        env:
          INPUT_APP_VERSION: ${{ github.event.inputs.app_version }}
        run: |
          # Only an explicit manual app_version pins the lookup. Scheduled runs
          # and a manual run with an empty input leave it empty, so the script
          # prefers any PENDING_DEVELOPER_RELEASE version over the marketing
          # version currently on main.
          if [ -n "$INPUT_APP_VERSION" ]; then
            echo "version=$INPUT_APP_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Release Health and Release Approved Version
        run: |
          cd apps/ios
          bundle exec ruby ../../.github/scripts/release-approved-app-store-version.rb
        env:
          APP_STORE_APP_ID: "6755209876"
          APP_IDENTIFIER: com.logyourbody.app
          APP_VERSION: ${{ steps.app_version.outputs.version }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'jovie' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'log-your-body-ios' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_HEALTH_MIN_CRASH_FREE_PERCENT: ${{ vars.RELEASE_HEALTH_MIN_CRASH_FREE_PERCENT || '99.5' }}
          RELEASE_HEALTH_MAX_REGRESSION_PP: ${{ vars.RELEASE_HEALTH_MAX_REGRESSION_PP || '0.5' }}
          RELEASE_HEALTH_MIN_SESSIONS: ${{ vars.RELEASE_HEALTH_MIN_SESSIONS || '100' }}
          RELEASE_HEALTH_MIN_USERS: ${{ vars.RELEASE_HEALTH_MIN_USERS || '20' }}

      - name: Cleanup
        if: always()
        run: rm -f apps/ios/fastlane/api_key.json
