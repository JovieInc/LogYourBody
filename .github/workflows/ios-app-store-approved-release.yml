name: iOS App Store Approved Release

# Kept clock (external fact): Apple App Review state changes in App Store
# Connect, which emits no GitHub event here. Replacement: an App Store Connect
# webhook (appStoreVersion state) bridged to repository_dispatch. The run only
# checks release health before releasing and throughout phased rollout.
# Unhealthy or unverified active rollouts are paused and tracked in an issue.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Optional App Store version to release after Apple approval'
        required: false
        type: string

concurrency:
  group: ios-app-store-approved-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-approved-version:
    name: Release Approved App Store Version
    if: github.ref == 'refs/heads/main'
    # Ruby 3.1 has prebuilt archives for Ubuntu 24.04, but not Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Ruby and Bundler
        uses: ./.github/actions/setup-ruby-bundler
        with:
          working-directory: apps/ios
          cache-key-prefix: ios-release-monitor-gems

      - name: Setup App Store Connect Authentication
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          cd apps/ios
          mkdir -p fastlane

          ruby <<'RUBY'
          require "json"

          api_key = {
            "key_id" => ENV.fetch("ASC_KEY_ID"),
            "issuer_id" => ENV.fetch("ASC_ISSUER_ID"),
            "key" => ENV.fetch("ASC_PRIVATE_KEY").gsub("\\n", "\n"),
            "duration" => 1200,
            "in_house" => false
          }

          File.write("fastlane/api_key.json", JSON.pretty_generate(api_key))
          JSON.parse(File.read("fastlane/api_key.json"))
          RUBY

          echo "APP_STORE_CONNECT_API_KEY_PATH=$(pwd)/fastlane/api_key.json" >> "$GITHUB_ENV"

      - name: Resolve App Version
        id: app_version
        env:
          INPUT_APP_VERSION: ${{ github.event.inputs.app_version }}
        run: |
          if [ -n "$INPUT_APP_VERSION" ]; then
            version="$INPUT_APP_VERSION"
          else
            version="$(awk -F ' = ' '/MARKETING_VERSION = / { gsub(/[;[:space:]]/, "", $2); if ($2 ~ /^[0-9]+[.][0-9]+/) { print $2; exit } }' apps/ios/LogYourBody.xcodeproj/project.pbxproj)"
          fi

          if [ -z "$version" ]; then
            echo "::error::Unable to resolve App Store version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check Release Health and Release Approved Version
        run: |
          cd apps/ios
          bundle exec ruby ../../.github/scripts/release-approved-app-store-version.rb
        env:
          APP_STORE_APP_ID: "6755209876"
          APP_IDENTIFIER: com.logyourbody.app
          APP_VERSION: ${{ steps.app_version.outputs.version }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'jovie' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'log-your-body-ios' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_HEALTH_MIN_CRASH_FREE_PERCENT: ${{ vars.RELEASE_HEALTH_MIN_CRASH_FREE_PERCENT || '99.5' }}
          RELEASE_HEALTH_MAX_REGRESSION_PP: ${{ vars.RELEASE_HEALTH_MAX_REGRESSION_PP || '0.5' }}
          RELEASE_HEALTH_MIN_SESSIONS: ${{ vars.RELEASE_HEALTH_MIN_SESSIONS || '100' }}
          RELEASE_HEALTH_MIN_USERS: ${{ vars.RELEASE_HEALTH_MIN_USERS || '20' }}

      - name: Cleanup
        if: always()
        run: rm -f apps/ios/fastlane/api_key.json
