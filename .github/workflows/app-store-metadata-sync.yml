name: App Store Metadata Sync

# Uploads the committed Fastlane metadata to the editable App Store version.
# deliver skips the binary. This does not attach a build, submit, or upload screenshots.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/app-store-metadata-sync.yml
      - apps/ios/fastlane/metadata/**
      - apps/ios/fastlane/storefront-manifest.generated.json

permissions:
  contents: read

concurrency:
  group: app-store-metadata-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync en-US metadata to App Store 1.2.0
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Ruby and Bundler
        uses: ./.github/actions/setup-ruby-bundler
        with:
          working-directory: apps/ios
          cache-key-prefix: ios-metadata-sync-gems

      - name: Setup App Store Connect Authentication
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          cd apps/ios
          mkdir -p fastlane

          ruby <<'RUBY'
          require "json"

          api_key = {
            "key_id" => ENV.fetch("ASC_KEY_ID"),
            "issuer_id" => ENV.fetch("ASC_ISSUER_ID"),
            "key" => ENV.fetch("ASC_PRIVATE_KEY").gsub("\\n", "\n"),
            "duration" => 1200,
            "in_house" => false
          }

          File.write("fastlane/api_key.json", JSON.pretty_generate(api_key))
          JSON.parse(File.read("fastlane/api_key.json"))
          RUBY

          echo "APP_STORE_CONNECT_API_KEY_PATH=$(pwd)/fastlane/api_key.json" >> "$GITHUB_ENV"

      - name: Upload metadata with deliver
        working-directory: apps/ios
        env:
          APP_IDENTIFIER: com.logyourbody.app
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          FASTLANE_DISABLE_ANIMATION: "1"
        run: |
          bundle exec fastlane run upload_to_app_store \
            api_key_path:"$APP_STORE_CONNECT_API_KEY_PATH" \
            app_identifier:"com.logyourbody.app" \
            app_version:"1.2.0" \
            metadata_path:"fastlane/metadata" \
            skip_binary_upload:true \
            skip_screenshots:true \
            submit_for_review:false \
            force:true \
            run_precheck_before_submit:false \
            precheck_include_in_app_purchases:false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set What's New on the first App Store version
        working-directory: apps/ios
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ env.APP_STORE_CONNECT_API_KEY_PATH }}
        run: |
          bundle exec ruby <<'RUBY'
          require "json"
          require "open3"
          require "spaceship"

          notes = File.read("fastlane/metadata/en-US/release_notes.txt").strip
          abort "Committed release notes are empty" if notes.empty?

          Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.from(
            filepath: ENV.fetch("APP_STORE_CONNECT_API_KEY_PATH")
          )
          app = Spaceship::ConnectAPI::App.find("com.logyourbody.app")
          abort "App not found" unless app
          version = app.get_edit_app_store_version(platform: Spaceship::ConnectAPI::Platform::IOS)
          abort "No editable App Store version" unless version
          abort "Editable version is #{version.version_string}, expected 1.2.0" unless version.version_string == "1.2.0"
          version_count = Spaceship::ConnectAPI.get_app_store_versions(
            app_id: app.id,
            filter: { platform: Spaceship::ConnectAPI::Platform::IOS },
            limit: 2
          ).count

          localization = Spaceship::ConnectAPI::AppStoreVersionLocalization.all(
            app_store_version_id: version.id
          ).find { |item| item.locale == "en-US" }
          abort "en-US localization missing" unless localization

          begin
            localization.update(attributes: { whats_new: notes })
          rescue StandardError => error
            message = error.message.to_s
            if message.match?(/BEGIN |PRIVATE KEY|api_key/i)
              warn "App Store Connect rejected What's New"
              exit 1
            end

            helper = File.expand_path("../../.github/scripts/app-store-whats-new.mjs")
            stdout, status = Open3.capture2(
              "node", helper,
              stdin_data: JSON.generate({ "versionCount" => version_count, "errorMessage" => message })
            )
            unless status.success?
              warn "What's New decision helper failed"
              exit 1
            end
            case stdout.strip
            when "skipped-first-version"
              puts "::warning::What's New is not editable on the only App Store version (#{version.version_string}). Apple rejected whatsNew. Committed notes stay in release_notes.txt until a second version exists."
            when "failed"
              warn message
              exit 1
            else
              warn "Unexpected What's New decision"
              exit 1
            end
          else
            puts "Set en-US What's New on #{version.version_string} (#{notes.bytesize} bytes)"
          end
          RUBY

      - name: Cleanup
        if: always()
        run: rm -f apps/ios/fastlane/api_key.json
