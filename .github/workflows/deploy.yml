name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - '.npmrc'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vercel.json'
              - 'apps/web/vercel.json'
            ios:
              - 'apps/ios/**'

  web:
    name: Web
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.web == 'true'
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_bpNDbti6srVLYPKdmQLu4UgT
      VERCEL_PROJECT_ID: prj_6seYBdTtY3TuFqrJek1puaFG6Trj
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test:ci

      - name: Build
        run: cd apps/web && pnpm build

      - name: Pull Vercel environment
        run: pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID"

      - name: Verify authenticated chat runtime configuration
        run: |
          env_file=.vercel/.env.production.local
          test -f "$env_file"
          missing_variables=0
          for required_variable in DATABASE_URL OPENAI_API_KEY CRON_SECRET; do
            if ! grep -qE "^${required_variable}=" "$env_file"; then
              echo "::error::Missing required Vercel production variable: $required_variable"
              missing_variables=1
            fi
          done
          test "$missing_variables" -eq 0

      - name: Apply product database migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          pnpm --filter logyourbody db:apply:neon

      - name: Build Vercel output
        run: pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID"

      - name: Deploy to Vercel
        id: vercel-deploy
        run: |
          DEPLOYMENT_URL=$(pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID")
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $DEPLOYMENT_URL"

      - name: Deploy info
        run: |
          {
            echo "## Web Deployment"
            echo ""
            echo "✅ Build and production deploy completed successfully"
            echo ""
            echo "URL: ${{ steps.vercel-deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  ios-beta:
    name: iOS Beta
    runs-on: macos-26
    needs: [detect-changes, web]
    if: needs.detect-changes.outputs.ios == 'true' && false # Enable when ready
    timeout-minutes: 30
    environment:
      name: development
      url: https://testflight.apple.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup iOS build environment
        uses: ./.github/actions/setup-ios-build
        with:
          xcode-version: 'latest-stable'
          working-directory: apps/ios
          setup-ruby: 'true'
          create-config-files: 'true'

      - name: Setup App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          cd apps/ios
          mkdir -p fastlane

          ruby <<'RUBY'
          require "json"

          api_key = {
            "key_id" => ENV.fetch("ASC_KEY_ID"),
            "issuer_id" => ENV.fetch("ASC_ISSUER_ID"),
            "key" => ENV.fetch("ASC_PRIVATE_KEY").gsub("\\n", "\n"),
            "duration" => 1200,
            "in_house" => false
          }

          File.write("fastlane/api_key.json", JSON.pretty_generate(api_key))
          JSON.parse(File.read("fastlane/api_key.json"))
          RUBY

          echo "APP_STORE_CONNECT_API_KEY_PATH=$(pwd)/fastlane/api_key.json" >> "$GITHUB_ENV"

      - name: Generate build number
        id: build
        run: |
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M%S)
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Deploy to TestFlight
        run: |
          cd apps/ios
          bundle exec fastlane beta build_number:${{ steps.build.outputs.build_number }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_IDENTIFIER: com.logyourbody.app
          APP_STORE_APP_ID: "6755209876"
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

      - name: Cleanup
        if: always()
        run: |
          cd apps/ios
          rm -f fastlane/api_key.json

  deploy-summary:
    name: Deploy Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [detect-changes, web, ios-beta]
    steps:
      - name: Generate summary
        run: |
          detect_result="${{ needs.detect-changes.result }}"
          web_changed="${{ needs.detect-changes.outputs.web }}"
          ios_changed="${{ needs.detect-changes.outputs.ios }}"
          web_result="${{ needs.web.result }}"
          ios_result="${{ needs.ios-beta.result }}"
          summary_status=0

          expected_web="skipped"
          if [[ "$web_changed" == "true" ]]; then
            expected_web="success"
          fi
          # ios-beta is explicitly disabled above. Enabling it must also update
          # this expectation and the dependency-propagation tests.
          expected_ios="skipped"

          {
            echo "## Deployment Summary"
            echo ""
            echo "- Change detection: $detect_result"
            echo "- Web changed: $web_changed"
            echo "- iOS changed: $ios_changed"
            echo "- Web deployment: $web_result (expected $expected_web)"
            echo "- iOS deployment: $ios_result (expected $expected_ios; beta deployment disabled)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$detect_result" != "success" ]]; then
            echo "::error::Deployment change detection did not succeed: $detect_result"
            summary_status=1
          fi
          for changed in "$web_changed" "$ios_changed"; do
            if [[ "$changed" != "true" && "$changed" != "false" ]]; then
              echo "::error::Missing or invalid deployment change-detection output"
              summary_status=1
            fi
          done
          if [[ "$web_result" != "$expected_web" ]]; then
            echo "::error::Web deployment result was '$web_result'; expected '$expected_web'"
            summary_status=1
          fi
          if [[ "$ios_result" != "$expected_ios" ]]; then
            echo "::error::iOS deployment result was '$ios_result'; expected '$expected_ios'"
            summary_status=1
          fi
          exit "$summary_status"
