name: 'Setup Ruby and Bundler'
description: 'Install Ruby, Bundler and cache dependencies'
inputs:
  ruby-version:
    description: 'Ruby version to use'
    required: false
    default: '3.1'
  bundler-version:
    description: 'Bundler version to use'
    required: false
    default: '2.4.10'
  working-directory:
    description: 'Working directory containing Gemfile'
    required: false
    default: '.'
  cache-key-prefix:
    description: 'Prefix for cache key'
    required: false
    default: 'gems'

runs:
  using: 'composite'
  steps:
    - name: Setup Ruby
      if: runner.environment == 'github-hosted'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: false  # We'll handle caching ourselves for better control

    # ruby/setup-ruby needs /Users/runner/hostedtoolcache, which the
    # self-hosted Macs lack; they carry the same Ruby line from Homebrew.
    - name: Use Homebrew Ruby on self-hosted Macs
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        prefix="/opt/homebrew/opt/ruby@${{ inputs.ruby-version }}"
        if [[ ! -x "$prefix/bin/ruby" ]]; then
          echo "::error::Self-hosted Mac lacks Homebrew ruby@${{ inputs.ruby-version }} (brew install ruby@${{ inputs.ruby-version }})."
          exit 1
        fi
        echo "$prefix/bin" >> "$GITHUB_PATH"
        "$prefix/bin/ruby" -e 'puts Gem.bindir' >> "$GITHUB_PATH"

    - name: Get Ruby version
      id: ruby-version
      shell: bash
      run: |
        ruby -rrbconfig -rdigest -e '
          puts "version=#{RUBY_VERSION}p#{RUBY_PATCHLEVEL}"
          identity = [RUBY_DESCRIPTION, RUBY_PLATFORM, File.realpath(RbConfig.ruby), RbConfig::CONFIG.sort]
          puts "abi=#{Digest::SHA256.hexdigest(Marshal.dump(identity))}"
        ' >> "$GITHUB_OUTPUT"

    - name: Get Gemfile.lock hash
      id: gemfile-hash
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f Gemfile.lock ]; then
          HASH=$(shasum Gemfile.lock | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT
        else
          echo "hash=none" >> $GITHUB_OUTPUT
        fi

    # Self-hosted workspaces can retain gems even when no cache matches.
    - name: Clear stale bundle before cache restore
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        rm -rf vendor/bundle

    - name: Cache Ruby dependencies
      uses: actions/cache@v4
      id: bundler-cache
      with:
        path: ${{ inputs.working-directory }}/vendor/bundle
        # v2 cannot restore old caches that mixed Homebrew and hosted Ruby builds.
        key: ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ inputs.cache-key-prefix }}-ruby-v2-${{ steps.ruby-version.outputs.version }}-${{ steps.ruby-version.outputs.abi }}-${{ steps.gemfile-hash.outputs.hash }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ inputs.cache-key-prefix }}-ruby-v2-${{ steps.ruby-version.outputs.version }}-${{ steps.ruby-version.outputs.abi }}-

    - name: Install Bundler
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        gem install bundler:${{ inputs.bundler-version }}
        bundle config path vendor/bundle
        bundle config set --local deployment 'true'
        bundle config set --local jobs '4'
        bundle config set --local retry '3'

    - name: Install dependencies
      if: steps.bundler-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bundle install

    - name: Update bundle if cache hit
      if: steps.bundler-cache.outputs.cache-hit == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # Check if bundle is satisfied, install if needed
        bundle check || bundle install

    - name: Verify Ruby setup
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "Ruby: $(ruby --version)"
        echo "Bundler: $(bundle --version)"
        echo "Bundle path: $(bundle config get path)"
        # bundle check checks installed specs, not whether native gems can load.
        bundle exec ruby -e 'require "date"; require "psych"; require "json"; require "ffi"'
